<!doctype html>
<html lang="en"><head>
<meta name="robots" content="noindex"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Environment Board · From The Pocket</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%2296%22%20fill%3D%22%23111318%22/%3E%3Ctext%20x%3D%22256%22%20y%3D%22228%22%20text-anchor%3D%22middle%22%20font-family%3D%22Hanken%20Grotesk%2Csans-serif%22%20font-weight%3D%22700%22%20font-size%3D%22196%22%20fill%3D%22%2300c896%22%3EFTP%3C/text%3E%3Crect%20x%3D%22146%22%20y%3D%22360%22%20width%3D%2236%22%20height%3D%2256%22%20rx%3D%225%22%20fill%3D%22%2300c896%22/%3E%3Crect%20x%3D%22192%22%20y%3D%22332%22%20width%3D%2236%22%20height%3D%2284%22%20rx%3D%225%22%20fill%3D%22%2300c896%22/%3E%3Crect%20x%3D%22238%22%20y%3D%22304%22%20width%3D%2236%22%20height%3D%22112%22%20rx%3D%225%22%20fill%3D%22%2300c896%22/%3E%3Crect%20x%3D%22284%22%20y%3D%22332%22%20width%3D%2236%22%20height%3D%2284%22%20rx%3D%225%22%20fill%3D%22%23f87171%22/%3E%3Crect%20x%3D%22330%22%20y%3D%22360%22%20width%3D%2236%22%20height%3D%2256%22%20rx%3D%225%22%20fill%3D%22%23f87171%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky1:#b9c8cf;--sky2:#cfd9dd;--title:#20314f;--ink:#1c2a38;--ink2:#4b5b66;--skyink:#3c4b55;
--sheet:#f3f6f5;--card:#fbfcfc;--hair:#dfe5e6;--hair2:#cad3d6;
--cherry:#ff6b7a;--cherryink:#2a0c10;--pist:#c7dc8a;--pistnum:#2b4a08;--pistlbl:#3f5d12;--pistink:#1f2d16;--disc:#f7f9f2;
--aqua:#8fd0d6}
.t-Elite{--fill:#8cc04a;--txt:#4c7a13;--band:#e7f2d6;--deep:#3a5f0d}
.t-Strong{--fill:#8aa9f2;--txt:#3a5bb3;--band:#e2e9fb;--deep:#2c4690}
.t-Neutral{--fill:#b6c1c7;--txt:#5e6c74;--band:#e9eef0;--deep:#4a575e}
.t-Weak{--fill:#ffae6b;--txt:#a85a1c;--band:#ffeedf;--deep:#8a4612}
.t-Avoid{--fill:#ff6b7a;--txt:#b02336;--band:#ffe1e4;--deep:#8f1a2a}
*{box-sizing:border-box}
html{background:var(--sky2)}
body{margin:0;color:var(--ink);font:15px/1.5 'Hanken Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums lining-nums;background:transparent}
.sky{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky1),var(--sky2));z-index:0}
#motes{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 16px 40px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--title);outline-offset:2px}
/* header: open sky, the motes live here */
.head{position:relative;padding:24px 12px 0;min-height:300px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;font:600 15px 'Hanken Grotesk';color:var(--title)}
.brand .mark svg{width:30px;height:30px;display:block}
.kicker{font:600 17px/1.1 'Hanken Grotesk';color:var(--skyink);margin:26px 0 0}
h1{font:800 46px/1.05 'Hanken Grotesk';letter-spacing:-.015em;margin:2px 0 10px;color:var(--title)}
/* the slate: every game pinned at its grade on one scale; this is the top of the page */
.slate{position:relative;margin:30px 0 0;padding:0 0 50px}
.slate .lanes{position:relative}
.stem{position:absolute;bottom:0;width:2px;transform:translateX(-50%);background:var(--title);opacity:.35}
.pin{position:absolute;transform:translateX(-50%);display:flex;align-items:center;gap:3px;background:var(--sheet);border:0;border-bottom:3px solid var(--fill);padding:5px 7px 4px;cursor:pointer;font:700 17px 'Hanken Grotesk';color:var(--deep);white-space:nowrap;z-index:1}
.pin img{width:30px;height:30px;object-fit:contain}
.pin b{margin-left:5px}
.pin.top{background:var(--pist);color:var(--pistnum);border-bottom-color:var(--pistnum)}
.pin.started{opacity:.55}
.slate .base{position:relative;height:8px}
.zone{position:absolute;top:0;height:8px;background:var(--fill)}
.slate .gt{position:absolute;top:-7px;width:2px;height:7px;background:var(--title);transform:translateX(-50%)}
.slate .cv{position:absolute;top:12px;transform:translateX(-50%);font:600 12.5px 'Hanken Grotesk';color:var(--skyink)}
.slate .zn{position:absolute;top:28px;transform:translateX(-50%);font:800 14px 'Hanken Grotesk';color:var(--deep);white-space:nowrap}
.best{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:0;font-size:15px;color:var(--title)}
.best .lbl{font-weight:800;color:var(--pistnum)}
.best img{width:26px;height:26px;object-fit:contain;vertical-align:middle}
.best .go{background:none;border:0;padding:0;font:700 15px 'Hanken Grotesk';color:var(--title);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.dek{max-width:58ch;margin:0;color:var(--skyink);font-size:16px}
.sub{color:var(--skyink);font-size:13px;margin:6px 0 0}
.agate{display:flex;flex-wrap:wrap;gap:2px 18px;margin:30px 0 0;padding-top:14px;border-top:1px solid var(--hair2);font-size:13px;color:var(--ink2)}
.agate b{color:var(--title);font-weight:600}
.weeks{display:flex;gap:4px;margin-top:auto;padding-top:24px;overflow-x:auto}
.wk{flex:none;background:rgba(255,255,255,.42);border:0;border-radius:4px 4px 0 0;padding:8px 18px 9px;cursor:pointer;text-align:left;color:var(--title)}
.wk b{display:block;font:700 16px/1.2 'Hanken Grotesk'}
.wk span{font-size:12px;color:var(--skyink)}
.wk.on{background:var(--cherry);color:var(--cherryink)}
.wk.on span{color:var(--cherryink)}
.wk .live{display:inline-block;width:7px;height:7px;border-radius:1px;background:currentColor;margin-left:7px;vertical-align:2px}
/* the ice sheet */
.sheet{position:relative;background:var(--sheet);border-radius:0 4px 4px 4px;padding:24px 26px 26px}
.notice{background:#ffeedf;color:#5a2e0a;padding:9px 14px;margin-bottom:16px;font-size:13.5px}
/* stage for the week's best game */
.hero{background:var(--pist);color:var(--pistink);border-radius:0 4px 0 0;margin:-24px -26px 0;padding:22px 26px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 28px;align-items:center;cursor:pointer}
.hero .lbl{grid-column:1/-1;font:600 14px 'Hanken Grotesk';color:var(--pistlbl)}
.hero .teams{display:flex;align-items:center;gap:12px}
.hero .teams img{width:84px;height:84px;object-fit:contain;background:var(--disc);border-radius:50%;padding:9px}
.hero .at{font:300 26px 'Hanken Grotesk';color:var(--pistlbl)}
.hero .mt{font:800 32px/1.05 'Hanken Grotesk';display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.hero .facts{margin-top:7px;display:flex;flex-wrap:wrap;gap:3px 20px;font-size:15px}
.hero .facts b{font-weight:700}
.hero .gr{text-align:right;color:var(--pistnum)}
.hero .gr .big{font:300 116px/.82 'Hanken Grotesk';letter-spacing:-.04em;display:block}
.hero .gr .tier{font:700 15px 'Hanken Grotesk'}
.hero .meter{grid-column:1/-1;color:var(--pistnum);margin-top:8px}
.hero .ticks{height:34px;gap:4px;width:100%}.hero .ticks i{flex:1;width:auto;height:22px;opacity:.2}.hero .ticks i.cut{height:34px;opacity:.45}.hero .ticks i.on{opacity:1}
.hero .axis{margin-top:4px;height:16px}.hero .axis i,.hero .axis i.cut{height:0;opacity:1}.hero .axis i.cut::after{color:var(--pistlbl)}
.hero .more{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13.5px}
.hero .more .open{margin-left:auto;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.herodet{margin-top:10px}
/* calls: spotlight + start/sit */
.calls-sec{display:grid;grid-template-columns:minmax(280px,1fr) 2fr;gap:22px;margin:26px 0 8px}
.calls-sec:has(#spotlight:empty){grid-template-columns:1fr}
.calls-sec:has(#startsit:empty){grid-template-columns:1fr}
.sech{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px;font:800 19px 'Hanken Grotesk';color:var(--title)}
.sech span{font:500 13px 'Hanken Grotesk';color:var(--ink2)}
.sech .tog{margin-left:auto;background:none;border:0;color:var(--ink2);font:600 13px 'Hanken Grotesk';cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
.sech .mark svg{width:20px;height:20px;display:block;border-radius:4px}
.spl{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair);cursor:pointer}
.spl:last-child{border-bottom:1px solid var(--hair)}
.spl:hover .mn{text-decoration:underline;text-underline-offset:3px}
.spl img{width:30px;height:30px;object-fit:contain}
.spl .gn{margin-left:auto;font:600 26px/1 'Hanken Grotesk';color:var(--txt)}
.spl small{display:block;color:var(--ink2);font-size:12.5px}
.sscols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 16px}
.closed .sscols,.closed ul{display:none}
.sscol h5{margin:0 0 4px;padding:3px 0 5px;font:700 14px 'Hanken Grotesk';color:var(--cd);border-bottom:2px solid var(--cc)}
.sscol .p{display:flex;align-items:center;gap:7px;padding:4px 4px;cursor:pointer;font-size:13.5px}
.sscol .p:hover{background:var(--hair)}
.sscol .p .m{margin-left:auto;color:var(--ink2);font-size:12px;white-space:nowrap}
.ps{color:var(--ink2);font-size:12px}
/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 34px;align-items:center;margin:26px 0 4px;padding-top:18px;border-top:1px solid var(--hair2)}
.seg{display:flex;gap:2px 16px;flex-wrap:wrap}
.seg button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink2);padding:4px 0;font:600 14.5px 'Hanken Grotesk';cursor:pointer}
.seg button.on{color:var(--title);border-bottom-color:var(--cherry)}
select,.btn{background:none;color:var(--title);border:0;border-bottom:2px solid var(--hair2);border-radius:0;padding:4px 0;font:600 14.5px 'Hanken Grotesk';cursor:pointer}
.btn.on{border-bottom-color:var(--cherry)}
/* list */
.colh,.g{display:grid;grid-template-columns:minmax(240px,1.7fr) 214px 66px 84px 96px 146px minmax(118px,1fr);gap:14px;align-items:center}
.colh{font:600 12.5px 'Hanken Grotesk';color:var(--ink2);padding:16px 0 0;align-items:end}
.gax{position:relative}.gax #gaxis{position:absolute;left:56px;bottom:1px;width:153px}
.gn{min-width:46px}
.r{text-align:right}
.g>*,.hero>*,.calls-sec>*,.after>*{min-width:0}
.sub,.agate{overflow-wrap:anywhere}
.tierhead{display:flex;align-items:baseline;gap:10px;margin:22px 0 0;padding:7px 0 5px;border-top:3px solid var(--fill);color:var(--txt);font:800 18px 'Hanken Grotesk'}
.tierhead span{font:500 13.5px 'Hanken Grotesk'}
.tierhead.flat{--fill:var(--title);--txt:var(--title)}
.tierhead span{color:var(--ink2)}
.g{padding:11px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.g:hover{background:linear-gradient(90deg,transparent,var(--band) 12%,var(--band) 88%,transparent)}
.g.isopen{border-bottom-color:transparent}
.g.started{opacity:.6}
.g .m{display:flex;align-items:center;gap:8px}
.g .m img{width:36px;height:36px;object-fit:contain;flex:none;display:block}
.pin .lg img{display:block}
.g .m .at,.hero .mt .at{font-weight:300;color:var(--ink2)}
.mn{font:700 17px/1.25 'Hanken Grotesk';display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px}
.g .m small{display:block;font-size:12.5px;color:var(--ink2)}
.c-grade{display:flex;align-items:center;gap:10px}
.gn{font:600 30px/1 'Hanken Grotesk';min-width:42px;color:var(--txt)}
.c-grade .ticks{color:var(--fill)}
.c-grade small{display:block;font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap}
.c-grade small b{color:var(--txt);font-weight:700}
.big{font:600 19px/1.1 'Hanken Grotesk'}
.c-spread b,.c-tt b{font-weight:600}
.c-tt div{display:flex;align-items:center;justify-content:flex-end;gap:5px}
.c-wx b{font:600 17px 'Hanken Grotesk'}
.small,.c-wx small,.c-total small,.c-tt small{display:block;font-size:12px;color:var(--ink2);line-height:1.35}
.ticks{display:inline-flex;gap:2px;height:22px;flex:none;align-items:flex-end}
.ticks i{display:block;width:3px;height:15px;background:currentColor;opacity:.2;border-radius:1px}
.ticks i.cut{height:22px;opacity:.5}
.ticks i.on{opacity:1}
/* charging meter: a wave of light runs through the filled ticks; faster for better games, still below 48 */
.ticks.live i.on{opacity:.5;animation:charge var(--p) linear infinite;animation-delay:calc(var(--k) * var(--d))}
@keyframes charge{0%{opacity:.5}5%{opacity:1}16%{opacity:.5}100%{opacity:.5}}
/* logo gloss: a sheen cut to the logo's own shape fades up, holds, fades out. Away logo, then home a beat later,
   then rest. Same clock as the row's meter (every other wave), so better games keep a quicker beat. */
.lg{position:relative;display:inline-flex;flex:none}
.lg.live::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(155deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,.45) 34%,rgba(255,255,255,0) 58%);
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
  animation:gloss var(--sp) ease-in-out infinite;animation-delay:var(--gd,0s)}
@keyframes gloss{0%{opacity:0}9%{opacity:1}17%{opacity:1}27%{opacity:0}100%{opacity:0}}
.axis{height:14px;align-items:flex-start}.axis i,.axis i.cut{height:0;opacity:1;position:relative;background:none}
.axis i.cut::after{content:attr(data-v) attr(data-n);position:absolute;left:50%;transform:translateX(-50%);font:600 11.5px 'Hanken Grotesk';color:var(--ink2);white-space:nowrap}
.logo{object-fit:contain;flex:none}
.logo.sm{width:20px;height:20px}
.team{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.spot{display:inline-flex;align-items:center;gap:5px;font:700 12px 'Hanken Grotesk';color:var(--cherryink);background:var(--cherry);padding:1px 7px 1px 3px;white-space:nowrap}
.spot svg{width:15px;height:15px;display:block;border-radius:3px}
.ko{font:600 12px 'Hanken Grotesk';color:var(--ink2);border:1px solid var(--hair2);padding:0 6px}
/* position scores */
.pos{display:grid;grid-template-columns:auto 38px 38px;gap:3px 5px;align-items:center;justify-content:start}
.pos .ph{font:600 11.5px 'Hanken Grotesk';color:var(--ink2);text-align:center}
.pos .pt{display:inline-flex;align-items:center;gap:4px;font:600 12.5px 'Hanken Grotesk';color:var(--ink2)}
.pb{font:700 13px 'Hanken Grotesk';background:var(--band);color:var(--deep);border-bottom:2px solid var(--fill);padding:1px 0;text-align:center}
.dim{opacity:.35}
.rowcalls,.rowinj,.badges{margin-top:4px;font-size:13px;line-height:1.45;color:var(--ink)}
.rowinj,.badges{color:var(--ink2);font-size:12.5px}
.sep{color:var(--hair2);padding:0 5px}
.call{font-size:13px;white-space:nowrap}
.call b{font-weight:700;color:var(--cd)}
.call b::before{content:"";display:inline-block;width:7px;height:7px;background:var(--cc);margin-right:5px;vertical-align:1px}
.c-smash{--cc:#8cc04a;--cd:#3a5f0d}.c-start{--cc:#8aa9f2;--cd:#2c4690}.c-desp{--cc:#ffae6b;--cd:#8a4612}.c-stream{--cc:var(--aqua);--cd:#1f5f66}.c-watch{--cc:#b6c1c7;--cd:#4a575e}.c-sit{--cc:#ff6b7a;--cd:#8f1a2a}
.inj-pill{font-weight:700;color:var(--ic);white-space:nowrap}
.i-out,.i-doubt{--ic:#b02336}.i-q,.i-dnp{--ic:#a85a1c}.i-lim{--ic:#3a5bb3}
.bdg{font-weight:600;white-space:nowrap}
.bdg.up{color:#3a5f0d}.bdg.down{color:#8f1a2a}.bdg.info{color:#8a4612}
/* rhythm: games worth targeting get room; the rest of the slate tightens up */
.g.t-Neutral,.g.t-Weak,.g.t-Avoid{padding:7px 0}
.g.t-Neutral .m img,.g.t-Weak .m img,.g.t-Avoid .m img{width:28px;height:28px}
.g.t-Neutral .gn,.g.t-Weak .gn,.g.t-Avoid .gn{font-size:24px}
.g.t-Neutral .mn,.g.t-Weak .mn,.g.t-Avoid .mn{font-size:15.5px}
.g.t-Elite .gn{font-size:36px}
.g.t-Elite .m img{width:42px;height:42px}
/* expanded game */
.det{padding:8px 0 20px;border-bottom:1px solid var(--hair2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px 28px}
.ledger{border-top:2px solid var(--title);padding:10px 2px 6px;color:var(--ink);cursor:auto}
.ledger h4{margin:0 0 10px;font:800 15px 'Hanken Grotesk';color:var(--title)}
.ledger table{width:100%;border-collapse:collapse;font-size:13px}
.ledger th,.ledger td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--hair)}
.ledger th:first-child,.ledger td:first-child{text-align:left}
.ledger th{color:var(--ink2);font-weight:600}
.ledger tr.cons td{font-weight:700;color:var(--title);background:#e7f2d6}
/* views: game board / team volume (week tabs drive both) */
.views{display:flex;flex-wrap:wrap;gap:4px 28px;margin:0 0 6px;border-bottom:1px solid var(--hair2)}
.views button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:4px 0 8px;font:800 19px 'Hanken Grotesk';color:var(--ink2);cursor:pointer}
.views button.on{color:var(--title);border-bottom-color:var(--cherry)}
body.v-vol .calls-sec,body.v-vol #tierSeg,body.v-vol #sort,body.v-vol #notesOnly,body.v-vol #expandAll,body.v-vol .colh,body.v-vol #body,body.v-vol .after{display:none}
body:not(.v-vol) #volume,body:not(.v-vol) #groupBtn{display:none}
body.v-vol .controls{border-top:0;padding-top:0;margin-top:16px}
.vt .op{display:none;font:500 12px 'Hanken Grotesk';color:var(--ink2)}
/* team volume table */
#volume{margin-top:18px}
.vwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.vt{width:100%;min-width:780px;border-collapse:collapse;font-size:14px}
.vt th{font:600 12.5px 'Hanken Grotesk';color:var(--ink2);text-align:right;padding:8px 10px 6px;border-bottom:2px solid var(--title);white-space:nowrap;vertical-align:bottom}
.vt th button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.vt th.on button{color:var(--title);text-decoration:underline;text-decoration-color:var(--cherry);text-decoration-thickness:2px;text-underline-offset:4px}
.vt th.l,.vt td.l{text-align:left}
.vt td{padding:8px 10px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}
.vt .tm{display:flex;align-items:center;gap:8px;font:800 16px 'Hanken Grotesk';color:var(--title)}
.vt .tm img{width:28px;height:28px;object-fit:contain}
.vt .uv{color:var(--ink2)}
.vt .ch{font-weight:800;color:var(--txt);margin-left:6px}
.vt .ch.lead,.ledger .ch.lead{background:var(--band);color:var(--deep);border-bottom:2px solid var(--fill);padding:0 5px}
.vt .lean{font:700 11.5px 'Hanken Grotesk';color:var(--title);background:#e7f2d6;padding:0 5px;margin-left:4px}
.vt .was,.vt .lw{display:block;font-size:11.5px;color:var(--ink2);font-weight:500}
.vt tr.gh td{background:#e9eef0;color:var(--title);font-weight:700;text-align:left;padding:6px 10px}
.vt tr.gh img{width:20px;height:20px;object-fit:contain;vertical-align:-4px}
.vt tr.started td{opacity:.65}
.ledger .ch{font-weight:800;color:var(--txt);margin-left:4px}
.vhow{margin-top:22px;font-size:13.5px;color:var(--ink2);line-height:1.6;max-width:110ch}
.vhow b{color:var(--ink)}
@media(max-width:620px){.vt td:first-child,.vt th:first-child{position:sticky;left:0;background:var(--sheet);z-index:1}.views button{font-size:17px}

if(m.demo)$('#demo').innerHTML='<div class="notice"><b>Demo odds.</b> These sportsbook lines are simulated from the published schedule lines so you can see the board. Weather and pace are live. Add an Odds API key for real Pinnacle / FanDuel / DraftKings numbers.</div>';
function renderChips(){
  const items=[[`Baseline total (${b.total_source})`,f(b.total)],['League plays per team-game',f(b.ppg)],['Plays per drive',f(b.ppd,2)],['Neutral sec per play',f(b.spp)],
    ['Grade',`Vegas ${D.weights.vegas*100}% · weather ${D.weights.weather*100}%`]];
  if(!m.public)items.push(['Odds',m.odds_source]);
  const N=m.notes||{};
  const VW=(V.weeks||{})[curWeek];if(m.volume)items.push(['Team volume',VW?`Week ${curWeek} workload model · updated ${VW.modified}`:`Week ${curWeek} not out yet`]);
  if(N.found)items.push(['Notes',`${G().filter(g=>g.notes).length} of ${G().length} games · updated ${N.updated}`]);
  $('#chips').innerHTML=items.map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join('')}

$('#tierSeg').innerHTML=['All',...TIERS].map(l=>`<button data-l="${l}" class="${l==tierFilter?'on':''}">${l}</button>`).join('');
$('#notesOnly').classList.toggle('on',notesOnly);
const CH=(m.changes||[]).slice().sort((a,b)=>b.time.localeCompare(a.time));
const ago=h=>Date.now()-h*3600e3;
const fmtT=iso=>{const d=new Date(iso);return d.toLocaleDateString('en-US',{weekday:'short'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(' ','').toLowerCase()};
function groupChanges(list){const by=new Map();
  list.forEach(c=>{const k=c.time+'|'+c.game;if(!by.has(k))by.set(k,{time:c.time,game:c.game,items:[]});by.get(k).items.push(c)});
  return [...by.values()].map(r=>{const parts=[],calls={};
    r.items.forEach(c=>{const mm=c.kind==='calls'&&c.text.match(/^(.+?): (.+) \(new call\)$/);
      if(mm)(calls[mm[1]]=calls[mm[1]]||[]).push(mm[2]);else parts.push(c.kind==='notes'?c.text.toLowerCase():c.text)});
    const callTxt=Object.entries(calls).map(([k,v])=>k+' '+v.join(', '));
    return {time:r.time,game:r.game,text:[...parts.filter(p=>!/^notes/.test(p)),...callTxt,...parts.filter(p=>/^notes/.test(p))].join(' · ')}})}
function renderChanges(){const keys=new Set(G().map(g=>g.away+'@'+g.home));
  const recent=groupChanges(CH.filter(c=>new Date(c.time)>ago(48)&&keys.has(c.game)));
  $('#changes').innerHTML=`<div class="chg ${chgClosed?'closed':''}"><h3 class="sech">What moved <span>${recent.length?recent.length+' updates in the last 48 hours':'nothing in the last 48 hours'}</span>${recent.length?`<button class="tog" id="chgHead">${chgClosed?'Show':'Hide'}</button>`:''}</h3>
   <ul>${recent.slice(0,30).map(r=>`<li><span class="t">${fmtT(r.time)}</span><span class="gm">${r.game.replace('@',' at ')}</span><span>${esc(r.text)}</span></li>`).join('')}</ul></div>`;
  if($('#chgHead'))$('#chgHead').onclick=()=>{chgClosed=!chgClosed;saveState();renderChanges()}}
function badges(g){const k=g.away+'@'+g.home, seen=new Set();
  return CH.filter(c=>c.game===k&&new Date(c.time)>ago(24)&&!seen.has(c.kind)&&seen.add(c.kind)).map(c=>{
    const t={total:`Total ${c.up?'▲':'▼'}`,spread:'Spread moved',weather:`Weather ${c.up?'▲':'▼'}`,notes:c.text,calls:'Calls updated',injury:'Injury update',tier:c.text.replace('Tier ','')}[c.kind]||c.text;
    const cls=['notes','spread','calls'].includes(c.kind)?'info':(c.up?'up':'down');
    return `<span class="bdg ${cls}" title="${esc(fmtT(c.time)+': '+c.text)}">${esc(t)}</span>`}).join(SEP)}
$('#tierSeg').onclick=e=>{const l=e.target.dataset.l;if(!l)return;tierFilter=l;
  document.querySelectorAll('#tierSeg button').forEach(x=>x.classList.toggle('on',x.dataset.l==l));render();saveState()};
$('#sort').onchange=()=>{render();saveState()};
$('#notesOnly').onclick=e=>{notesOnly=!notesOnly;e.target.classList.toggle('on',notesOnly);render();saveState()};
$('#expandAll').onclick=()=>{const all=!G().every(g=>open.has(g.id));open=new Set(all?G().map(g=>g.id):[]);render();saveState()};

function logo(t,cls=''){const u=D.logos[t];return u?`<img class="logo ${cls}" src="${u}" alt="">`:''}
// one mask rule per team (the logo's own shape), so the shine only lights the logo, never its box
(()=>{const st=document.createElement('style');st.textContent=Object.entries(D.logos).filter(([,u])=>u).map(([t,u])=>`.lg-${t}::after{-webkit-mask-image:url("${u}");mask-image:url("${u}")}`).join('');document.head.appendChild(st)})();
// shine: same energy as the meter; period is two meter waves so the glint lands as a wave starts. None below 48.
function shine(t,v,cls='',second=false){const img=logo(t,cls);if(!img)return'';const e=Math.max(0,Math.min(1,(v-48)/30)),live=v>=48,per=2*(4.4-e*2.8);
  return `<span class="lg lg-${t}${live?' live':''}"${live?` style="--sp:${per.toFixed(2)}s;--gd:${second?(per*.16).toFixed(2):0}s"`:''}>${img}</span>`}
function team(t,cls='sm'){return `<span class="team">${logo(t,cls)}${t}</span>`}
// Shared grade scale: 30-90 in steps of 2, tall marks at the tier cutoffs, same in every row
const CUTS={38:'Weak',48:'Neutral',60:'Strong',70:'Elite'},LADDER=Array.from({length:31},(_,i)=>30+i*2);
// energy 0..1 from the grade (0 below 48, full at 78+): sets how fast the meter charges
const ladder=v=>{const e=Math.max(0,Math.min(1,(v-48)/30)),live=v>=48;
  const st=live?` style="--d:${(.12-e*.075).toFixed(3)}s;--p:${(4.4-e*2.8).toFixed(2)}s"`:'';
  return `<span class="ticks${live?' live':''}"${st} aria-hidden="true">${LADDER.map((x,k)=>`<i class="${x<=v?'on':''}${CUTS[x]?' cut':''}" style="--k:${k}"></i>`).join('')}</span>`};
const axis=full=>`<span class="ticks axis" aria-hidden="true">${LADDER.map(x=>CUTS[x]?`<i class="cut" data-v="${x}" data-n="${full?' '+CUTS[x]:''}"></i>`:'<i></i>').join('')}</span>`;
const ticks=(v,n)=>`<span class="ticks" aria-hidden="true">${Array.from({length:n},(_,i)=>`<i${i<Math.round((v||0)/100*n)?' class="on"':''}></i>`).join('')}</span>`;
const SEP='<span class="sep">/</span>';
const spotTag=()=>`<span class="spot" title="FTP Spotlight game: deep-dive notes inside">${MARK}FTP Spotlight</span>`;
const spreadTxt=g=>`${g.margin>=0?g.home:g.away} −${f(Math.abs(g.margin||0))}`;

function sortKey(g){if(posView==='pc'||posView==='rb')return -posBest(g,posView);
  switch($('#sort').value){
  case'total':return -(g.total||0);
  case'pace':return -g.pace_score;case'weather':return -g.weather.score;case'kick':return g.kickoff;default:return -g.overall}}

// The stage: best game still to play (or the best game, once the whole week has kicked off)
function heroGame(){const gs=G().slice().sort((a,b)=>b.overall-a.overall);return gs.find(g=>!g.started)||gs[0]}
let heroInList=true;
function renderHero(){const g=heroGame(),el=$('#best');if(!g){el.innerHTML='';return}
  const pos=g.pos||{},best=k=>{const ts=Object.keys(pos);if(!ts.length)return'';const t=ts.slice().sort((a,c)=>pos[c][k]-pos[a][k])[0];return `${t} ${f(pos[t][k],0)}`};
  const allStarted=G().every(x=>x.started);
  el.innerHTML=`<span class="lbl">${allStarted?"Week's best environment":'Best game still to play'}</span><span>${logo(g.away)} ${logo(g.home)} <b>${nm(g.away)} at ${nm(g.home)}</b>, ${g.kickoff_et}</span>${g.notes?spotTag():''}<span>Total <b>${f(g.total)}</b> · <b>${spreadTxt(g)}</b> · ${esc(g.weather.label)}</span>${g.pos?`<span>Best PC <b>${best('pc')}</b> · best RB <b>${best('rb')}</b></span>`:''}<button class="go" id="bestGo">Open the game</button>`;
  $('#bestGo').onclick=()=>jump(g.id)}
function jump(id){open.add(id);render();saveState();
  const el=document.querySelector(`.g[data-id="${id}"]`)||$('#body');el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}

const SORT_LABEL={total:'Sorted by game total',pace:'Sorted by pace (shown, not graded)',weather:'Sorted by weather',kick:'Sorted by kickoff'};
function render(){
  const gs=G().filter(g=>(tierFilter==='All'||g.tier===tierFilter)&&(!notesOnly||g.notes)).sort((a,b)=>{const x=sortKey(a),y=sortKey(b);return x<y?-1:x>y?1:0});
  const grouped=$('#sort').value==='overall'&&posView==='overall', hero=heroGame();
  heroInList=true;
  const list=heroInList?gs:gs.filter(g=>g.id!==hero.id);
  const item=g=>row(g)+(open.has(g.id)?detail(g):'');
  let html;
  if(!gs.length)html='<p class="small" style="padding:14px 0">No games match this filter.</p>';
  else if(grouped)html=TIERS.map(t=>{const x=list.filter(g=>g.tier===t),all=gs.filter(g=>g.tier===t).length;if(!all)return'';
    return `<div class="tierhead t-${t}">${t}<span>${all} game${all>1?'s':''}${x.length<all?' · top game shown above':''}</span></div>`+x.map(item).join('')}).join('');
  else html=`<div class="tierhead flat">${posView!=='overall'?`Ranked by best ${posView==='pc'?'pass-catcher':'RB'} score`:SORT_LABEL[$('#sort').value]}<span>${gs.length} games</span></div>`+list.map(item).join('');
  $('#body').innerHTML=html;
  document.querySelectorAll('#body .g').forEach(el=>{const t=()=>{const id=el.dataset.id;open.has(id)?open.delete(id):open.add(id);render();saveState()};
    el.onclick=t;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}}});
  $('#expandAll').textContent=G().every(g=>open.has(g.id))?'Collapse all':'Expand all';
  renderHero();
  renderVolume();
}
if(P.note)$('#posnote').innerHTML=`<div class="notice">${esc(P.note)}</div>`;
const tierOf=v=>v>=70?'Elite':v>=60?'Strong':v>=48?'Neutral':v>=38?'Weak':'Avoid';
function posBest(g,k){const p=g.pos;if(!p)return -1;return Math.max(...Object.values(p).map(x=>x[k]))}
const ord=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');
const ease=r=>r===1?'Easiest':ord(r)+'-easiest';
const posName={pc:'Pass catchers',rb:'RBs'};
function posBadge(x,k){const v=x[k],t=tierOf(v),dim=posView!=='overall'&&posView!==k;
  return `<span class="pb t-${t}${dim?' dim':''}" title="${posName[k]}: ${f(v,0)} (${t}). Matchup: ${x.opp} defense is the ${ease(x[k+'_rank']).toLowerCase()} for ${posName[k].toLowerCase()}.">${f(v,0)}</span>`}
function posGrid(g){if(!g.pos)return'';const dim=k=>posView!=='overall'&&posView!==k?' dim':'';
  return `<div class="pos"><span></span><span class="ph${dim('pc')}">PC</span><span class="ph${dim('rb')}">RB</span>${[g.away,g.home].filter(t=>g.pos[t]).map(t=>`<span class="pt">${logo(t,'sm')}${t}</span>${posBadge(g.pos[t],'pc')}${posBadge(g.pos[t],'rb')}`).join('')}</div>`}
function drv(label,z){const c=z>=0.5?'up':z<=-0.5?'dn':'';return `<span class="dr ${c}">${c==='up'?'▲':c==='dn'?'▼':'–'} ${label}</span>`}
function posCard(g){if(!g.pos)return'';
  const blocks=[g.away,g.home].filter(t=>g.pos[t]).map(t=>{const x=g.pos[t];
    const line=(k,extra)=>`<div class="pml"><b>${posName[k]}</b><span class="sc t-${tierOf(x[k])}">${f(x[k],0)} ${tierOf(x[k])}</span></div><div class="pmd">${drv(`${ease(x[k+'_rank'])} matchup`,x['opp_'+k+'_z'])}${extra}</div>`;
    return `<div class="pm"><div class="pmh">${team(t)}<span class="small">vs ${x.opp} defense</span></div>
      ${line('pc',drv('Game total',x.z_total)+drv(x.margin>=0?`Favored ${f(x.margin)}`:`Underdog ${f(-x.margin)}`,x.z_fav)+drv('Weather',x.z_weather))}
      ${line('rb',drv(x.margin>=0?`Favored ${f(x.margin)}`:`Underdog ${f(-x.margin)}`,x.z_fav))}</div>`}).join('');
  return `<div class="ledger"><h4>Position matchups</h4>${blocks}
    <div class="note">Matchup = how the opponent's defense ranks for that position in Game Flow SOS (through Week ${P.data_week}), out of 32. ▲ helps, ▼ hurts compared with the rest of this week's slate.</div></div>`}
function row(g){
  const bk=D.bookKeys.map((k,i)=>`${D.books[i]} ${g.books[k]?f(g.books[k].total):'–'}`).join(' · ');
  const bd=badges(g), o=open.has(g.id);
  return `<div class="g t-${g.tier}${g.started?' started':''}${o?' isopen':''}" data-id="${g.id}" role="button" tabindex="0" aria-expanded="${o}">
  <div class="c-game"><div class="m">${shine(g.away,g.overall)}<span class="at">at</span>${shine(g.home,g.overall,'',true)}<div><div class="mn">${g.away} at ${g.home}${g.notes?spotTag():''}${g.started?'<span class="ko">Kicked off</span>':''}</div><small>${g.kickoff_et} · ${esc(g.venue.name)}${g.venue.neutral?' (neutral)':''}</small></div></div>
    ${g.notes&&g.notes.calls.length?`<div class="rowcalls">${g.notes.calls.map(c=>callChip(c,false)).join(SEP)}</div>`:''}${rowInjuries(g)}${bd?`<div class="badges">${bd}</div>`:''}</div>
  <div class="c-grade"><b class="gn">${f(g.overall,0)}</b><div>${ladder(g.overall)}<small><b>${g.tier}</b> · Vegas ${f(g.vegas_score,0)} · Wx ${f(g.weather.score,0)}</small></div></div>
  <div class="c-total r" data-l="Total" title="${esc(bk)}"><b class="big">${f(g.total)}</b><small>3-book consensus</small></div>
  <div class="c-spread r" data-l="Spread"><b>${spreadTxt(g)}</b></div>
  <div class="c-tt r"><div>${team(g.away)} <b>${f(g.team_totals[g.away])}</b></div><div>${team(g.home)} <b>${f(g.team_totals[g.home])}</b></div><small>${g.tt_source[g.home]==='market'?'team total market':'implied from spread'}</small></div>
  <div class="c-pos">${posGrid(g)}</div>
  <div class="c-wx"><b>${f(g.weather.score,0)}</b><small>${esc(g.weather.label)}</small></div></div>`;
}
const CALL_ORDER=['Smash Spot','Must Start','Start','Sneaky Start','Desperate Start','Stream','Sleeper','Flex','Watch','Sit','Fade'];
const callCls=c=>({'Smash Spot':'c-smash','Must Start':'c-smash','Start':'c-start','Sneaky Start':'c-start','Flex':'c-start',
  'Desperate Start':'c-desp','Stream':'c-stream','Sleeper':'c-stream','Watch':'c-watch','Sit':'c-sit','Fade':'c-sit'})[c]||'c-watch';
function callChip(c,full){return `<span class="call ${callCls(c.call)}"><b>${esc(c.call)}</b> ${full&&c.team?logo(c.team,'sm'):''}${esc(c.name)}${full&&c.pos?` <span class="ps">${c.pos}</span>`:''}</span>`}
function bindJump(sel){document.querySelectorAll(sel).forEach(el=>el.onclick=()=>jump(el.dataset.id))}
function renderSpotlight(){const gs=G().filter(g=>g.notes).sort((a,b)=>a.kickoff<b.kickoff?-1:1);
  if(!gs.length){$('#spotlight').innerHTML='';return}
  $('#spotlight').innerHTML=`<h3 class="sech"><span class="mark">${MARK}</span>FTP Spotlight <span>${gs.length} deep dive${gs.length===1?'':'s'}</span></h3>
    ${gs.map(g=>`<div class="spl t-${g.tier}" data-id="${g.id}">${logo(g.away)}${logo(g.home)}<div><div class="mn">${nm(g.away)} at ${nm(g.home)}</div><small>${g.kickoff_et}${g.started?' · kicked off':''} · ${g.notes.calls.length?g.notes.calls.length+' call'+(g.notes.calls.length===1?'':'s')+' · ':''}read the notes</small></div><b class="gn">${f(g.overall,0)}</b></div>`).join('')}`;
  bindJump('.spl')}
function renderStartSit(){const rows=[];
  G().forEach(g=>(g.notes&&g.notes.calls||[]).forEach(c=>rows.push({c,g})));
  if(!rows.length){$('#startsit').innerHTML='';return}
  const cols=CALL_ORDER.filter(k=>rows.some(r=>r.c.call===k)).map(k=>{
    const list=rows.filter(r=>r.c.call===k).sort((a,b)=>b.g.overall-a.g.overall);
    return `<div class="sscol ${callCls(k)}"><h5>${k} · ${list.length}</h5>${list.map(({c,g})=>{
      const opp=c.team?(c.team===g.home?'vs '+g.away:'at '+g.home):g.away+' at '+g.home;
      const i=c.team&&injFor(g,c.team,c.name);
      return `<div class="p" data-id="${g.id}">${c.team?logo(c.team,'sm'):''}<span>${esc(c.name)}${c.pos?` <span class="ps">${c.pos}</span>`:''}${i?' '+injPill(i.status):''}</span><span class="m">${opp} · ${f(g.overall,0)}</span></div>`}).join('')}</div>`}).join('');
  $('#startsit').innerHTML=`<div class="ss ${ssClosed?'closed':''}"><h3 class="sech">Start / Sit <span>${rows.length} calls · game grade shown</span><button class="tog" id="ssHead">${ssClosed?'Show':'Hide'}</button></h3><div class="sscols">${cols}</div></div>`;
  $('#ssHead').onclick=()=>{ssClosed=!ssClosed;saveState();renderStartSit()};
  bindJump('#startsit .p')}
const injCls=s=>({Out:'i-out',IR:'i-out',PUP:'i-out',Doubtful:'i-doubt',Questionable:'i-q',DNP:'i-dnp'})[s]||'i-lim';
const SEVERE=new Set(['Out','IR','PUP','Doubtful','Questionable','DNP']);
const injPill=st=>`<span class="inj-pill ${injCls(st)}" title="${st==='DNP'?'Did not practice':st==='Limited'?'Limited practice':st}">${st}</span>`;
const pn=x=>x.toLowerCase().replace(/\b(jr|sr|ii|iii|iv)\b/g,'').replace(/[^a-z]/g,'');
function injFor(g,teamAbbr,name){return ((g.injuries||{})[teamAbbr]||[]).find(e=>pn(e.name)===pn(name))}
function injList(g,pred){const out=[];[g.away,g.home].forEach(t=>((g.injuries||{})[t]||[]).forEach(e=>{if(pred(e))out.push({...e,team:t})}));return out}
function rowInjuries(g){const all=injList(g,e=>e.group==='skill'&&SEVERE.has(e.status)),list=all.slice(0,4);if(!list.length)return'';
  const by=new Map();list.forEach(e=>{const k=['IR','PUP'].includes(e.status)?'IR':e.status;if(!by.has(k))by.set(k,[]);by.get(k).push(e)});
  const order=['Out','IR','Doubtful','Questionable','DNP'];
  return `<div class="rowinj">${[...by.entries()].sort((a,c)=>order.indexOf(a[0])-order.indexOf(c[0])).map(([st,l])=>`${injPill(st)} ${l.map(e=>`${esc(e.name)} ${e.pos}`).join(', ')}`).join(SEP)}${all.length>4?` <span class="ps">+${all.length-4} more</span>`:''}</div>`}
function injCard(g){const list=injList(g,()=>true);if(!list.length)return'';
  const byTeam=[g.away,g.home].map(t=>[t,list.filter(e=>e.team===t)]).filter(([,l])=>l.length);
  return `<div class="ledger"><h4>Injury report</h4>${byTeam.map(([t,l])=>`<div class="injteam">${team(t)}</div><table class="injtbl">${l.map(e=>`<tr><td>${esc(e.name)} <span class="ps">${e.pos}</span></td><td>${injPill(e.status)}</td><td class="ps">${esc(e.injury||'')}</td></tr>`).join('')}</table>`).join('')}
    <div class="note">Official injury report, significant players only: fantasy players by snap share, line and defense starters, and your Start/Sit players. DNP = did not practice.</div></div>`}
function renderInjPanel(){const rows=[];G().forEach(g=>injList(g,e=>e.group==='skill').forEach(e=>rows.push({e,g})));
  if(!rows.length){$('#injpanel').innerHTML='';return}
  const cols=[['Out / IR',e=>['Out','IR','PUP'].includes(e.status),'c-sit'],['Doubtful / Questionable',e=>['Doubtful','Questionable'].includes(e.status),'c-desp'],
    ['Missed practice',e=>e.status==='DNP','c-desp'],['Limited practice',e=>e.status==='Limited','c-start']];
  const html=cols.map(([label,pred,cls])=>{const list=rows.filter(r=>pred(r.e));if(!list.length)return'';
    return `<div class="sscol ${cls}"><h5>${label} · ${list.length}</h5>${list.map(({e,g})=>{
      const opp=e.team===g.home?'vs '+g.away:'at '+g.home;
      return `<div class="p" data-id="${g.id}">${logo(e.team,'sm')}<span>${esc(e.name)} <span class="ps">${e.pos}</span></span><span class="m">${opp}</span></div>`}).join('')}</div>`}).join('');
  $('#injpanel').innerHTML=`<div class="ss ${injClosed?'closed':''}"><h3 class="sech">Key injuries <span>${rows.length} players · official report</span><button class="tog" id="injHead">${injClosed?'Show':'Hide'}</button></h3><div class="sscols">${html}</div></div>`;
  $('#injHead').onclick=()=>{injClosed=!injClosed;saveState();renderInjPanel()};
  bindJump('#injpanel .p')}
function notesCard(g){const n=g.notes;if(!n)return'';
  const groups=n.groups.map(gr=>`<div class="ngroup">${gr.map(l=>`<p class="l${l.level}">${esc(l.text)}</p>`).join('')}</div>`).join('');
  return `<div class="ledger notes"><h4>FTP game notes</h4>${n.calls.length?`<div class="calls">${n.calls.map(c=>callChip(c,true)).join('')}</div>`:''}<div class="ngrid">${groups}</div></div>`}
function detail(g){
  const h=g.home,a=g.away;
  const bookRows=D.bookKeys.map((k,i)=>{const x=g.books[k];if(!x)return`<tr><td>${D.books[i]}</td><td colspan="4">not posted</td></tr>`;
    return `<tr><td>${D.books[i]}</td><td>${f(x.total)}</td><td>${x.spread_home==null?'–':(x.spread_home>0?'+':'')+f(x.spread_home)}</td><td>${f(x.tt[a])}</td><td>${f(x.tt[h])}</td></tr>`}).join('');
  const lines=`<div class="ledger"><h4>Lines by book</h4><table><tr><th>Book</th><th>Total</th><th>${h} spread</th><th>${a} TT</th><th>${h} TT</th></tr>${bookRows}
   <tr class="cons"><td>Consensus</td><td>${f(g.total)}</td><td>${g.margin>=0?'−':'+'}${f(Math.abs(g.margin||0))}</td><td>${f(g.team_totals[a])}</td><td>${f(g.team_totals[h])}</td></tr></table>
   <div class="note">Consensus = weighted average of juice-adjusted lines (a 47.5 at −120 counts a bit higher than 47.5).</div></div>`;
  const tp=g.team_pace,wr=g.weather.raw,rf=g.venue.roof;
  const wxCard=`<div class="ledger"><h4>Weather</h4>${rf!=='open'?`<div class="small">${rf==='dome'?'Indoors: weather doesn\'t matter.':'Retractable roof: normally closed when conditions are bad.'}</div>`:
    !wr?'<div class="small">Forecast not available yet (about 15 days out).</div>':
    `<table><tr><td>Temperature</td><td>${f(wr.temp_f,0)}°F</td></tr><tr><td>Wind (avg)</td><td>${f(wr.wind_mph,0)} mph</td></tr>
     <tr><td>Max gust</td><td>${f(wr.gust_mph,0)} mph</td></tr><tr><td>Precip chance</td><td>${f(wr.precip_prob,0)}%</td></tr>
     <tr><td>Precip total</td><td>${f(wr.precip_in,2)} in</td></tr>${wr.snow?'<tr><td>Snow</td><td>yes</td></tr>':''}</table>
     <div class="note">Averaged over the game window. Wind and rain together get an extra penalty.</div>`}</div>`;
  const pr=t=>{const p=tp[t];if(!p)return`<tr><td>${t}</td><td colspan="3">–</td></tr>`;
    return `<tr><td>${team(t)}</td><td>${f(p.ppg)} <span class="rk">#${p.ppg_rank}</span></td><td>${f(p.ppd,2)} <span class="rk">#${p.ppd_rank}</span></td><td>${f(p.spp)} <span class="rk">#${p.spp_rank}</span></td></tr>`};
  const cur=tp[h]?tp[h].games_cur:0;
  const pace=`<div class="ledger"><h4>Pace of play</h4><table><tr><th>Team</th><th>Plays/G</th><th>Plays/Dr</th><th>Sec/Play</th></tr>${pr(a)}${pr(h)}</table>
    ${g.pace?`<div class="note">This matchup: ${f(g.pace.ppg)} combined plays, ${f(g.pace.ppd,2)} per drive, ${f(g.pace.spp)}s per snap.</div>`:''}
    <div class="note">Sec/play = time between snaps in close-game situations (#1 = fastest). Blends this season (${cur} games) with last season until the sample grows.</div></div>`;
  const w=g.weather,W=D.weights;
  const why=`<div class="ledger"><h4>Grade breakdown</h4><table>
    <tr><td>Vegas (total ${f(g.total)} vs ${f(b.total)} baseline)</td><td>${f(g.vegas_score,0)}</td><td>× ${W.vegas}</td></tr>
    <tr><td>Weather (${esc(w.label)})</td><td>${f(w.score,0)}</td><td>× ${W.weather}</td></tr>
    <tr class="cons"><td>Overall</td><td>${f(g.overall,1)}</td><td></td></tr></table>
    <div class="note">Overall = Vegas ${W.vegas*100}% + weather ${W.weather*100}%, rescaled to the 0–100 tiers. Pace is shown for context only: the betting lines already price it in.</div></div>`;
  return `<div class="det"><div class="grid">${notesCard(g)}${why}${posCard(g)}${volCard(g)}${injCard(g)}${lines}${wxCard}${pace}</div></div>`;
}
$('#foot').innerHTML=(P.available?`<p><b>How position scores work:</b> each team's offense gets a pass-catcher (PC) and RB score, 0–100, colored with the same tiers as the overall grade. Pass catchers = 30% opponent Game Flow SOS (pass-catcher environment) + 24% game total + 23% favored by the spread + 23% weather. RBs = 50% opponent SOS (RB environment) + 50% favored by the spread. Total, spread and weather are compared across the week's slate; pace is left out because it didn't predict fantasy production in the SOS backtest. Expand a game to see each team's matchup rank and what's helping or hurting the score.</p>`:'')+
  `<p><b>How the grade works:</b> click any game to expand it. Vegas: consensus total vs the ${b.total_source}, with a small penalty for lopsided spreads. The overall grade is ${D.weights.vegas*100}% Vegas and ${D.weights.weather*100}% weather. Pace (plays per game, plays per drive, tempo) is shown for context but isn't graded: in a 2024–25 backtest it added nothing beyond the Vegas lines, which already price it in. Weather: Open-Meteo forecast averaged over the game window.</p>`+
  (m.public?`<div class="disclaimer">From The Pocket · For information and entertainment only, not betting advice. Lines and forecasts change; check your sportsbook before placing anything. Last updated ${m.generated}.</div>`:'');

// ---------------------------------------------------------------- team volume
// From the workload model (NFL Trends, Thursday 8am). volume.py rebuilds the line piece from this board's live spread.
const V=m.volume||{};
let view='board',volSort='dropbacks',volDir=-1,volGroup=false;
try{const st=JSON.parse(localStorage.getItem(SKEY)||'{}');view=st.view==='vol'?'vol':'board';volSort=st.volSort||'dropbacks';volDir=st.volDir||-1;volGroup=!!st.volGroup}catch(e){}
const VCUT={dropbacks:2.5,rb_opp:2,wrte_tgt:2,ed_npr:.03};
const vTier=(k,d)=>{const x=d/(VCUT[k]||2);return x>=1?'Elite':x>=.4?'Strong':x>-.4?'Neutral':x>-1?'Weak':'Avoid'};
const sgn=(x,n=1)=>x==null?'–':(Math.abs(x)<Math.pow(10,-n)/2?'':x>0?'+':'−')+Math.abs(x).toFixed(n);
const lineTxt=x=>x==null?'–':x>0?`−${f(x)}`:x<0?`+${f(-x)}`:'PK';  // spread > 0 = favored
const pp=(k,x)=>k==='ed_npr'&&x!=null?x*100:x;
function chgSpan(k,s,lead){const d=pp(k,s.delta),t=pp(k,s.delta_thu),u=k==='ed_npr'?' pts':'';
  const tip=`Usual ${k==='ed_npr'?f(s.norm*100)+'%':f(s.norm)}. Opponent's defense ${sgn(pp(k,s.from_def))}${u}, this week's line ${sgn(pp(k,s.from_line),2)}${u}. Thursday's model: ${sgn(t)}${u}.`;
  return `<span class="ch t-${vTier(k,s.delta)}${lead?' lead':''}" title="${esc(tip)}">${sgn(d)}${u}</span>`}
function moved(k,s){return s.delta_thu!=null&&Math.abs(pp(k,s.delta)-pp(k,s.delta_thu))>=.1?`<span class="was">Thu ${sgn(pp(k,s.delta_thu))}${k==='ed_npr'?' pts':''}</span>`:''}
function volRows(){const out=[];G().forEach(g=>{if(!g.vol)return;[g.away,g.home].forEach(t=>{if(g.vol[t])out.push({g,t,v:g.vol[t]})})});return out}
const vkey=r=>volSort==='line'?(r.v.spread==null?-99:r.v.spread):(r.v[volSort]?r.v[volSort].delta:-99);
function volRow({g,t,v}){const lead=k=>v.strong.includes(k),home=t===g.home;
  const cell=k=>{const s=v[k];if(!s)return'<td>–</td>';
    return k==='dropbacks'||k==='rb_opp'?`<td><span class="uv">${f(s.norm)} → </span><b>${f(s.proj)}</b>${chgSpan(k,s,lead(k))}${moved(k,s)}</td>`:`<td>${chgSpan(k,s,false)}${moved(k,s)}</td>`};
  const lm=v.spread_thu!=null&&v.spread!=null&&Math.abs(v.spread-v.spread_thu)>=.25?`<span class="lw">Thu ${lineTxt(v.spread_thu)}</span>`:'';
  return `<tr class="${g.started?'started':''}" data-id="${g.id}"><td class="l"><span class="tm">${logo(t)}${t}${v.strong.length?'<span class="lean">Strong lean</span>':''}</span><span class="op">${home?'vs':'at'} ${v.opp}${v.strong.length?' · strong lean':''}</span></td>
    <td class="l c-op">${home?'vs':'at'} ${v.opp}</td><td title="Usual line ${lineTxt(v.usual_spread)}">${lineTxt(v.spread)}${lm}</td>
    ${cell('dropbacks')}${cell('rb_opp')}${cell('wrte_tgt')}${cell('ed_npr')}</tr>`}
function renderVolume(){const el=$('#volume');if(!el)return;
  const VW=(V.weeks||{})[curWeek];
  if(!VW){const later=!V.current||Number(curWeek)>=Number(V.current);
    el.innerHTML=`<div class="notice">${later?`Team volume for Week ${curWeek} isn't out yet; it updates Thursday morning.`:`There's no team volume file for Week ${curWeek}.`}</div>${volHow()}`;return}
  const rows=volRows();
  if(!rows.length){el.innerHTML=`<div class="notice">The Week ${curWeek} team volume file doesn't match this week's games.</div>${volHow()}`;return}
  const sorted=rows.slice().sort((a,b)=>volDir<0?vkey(b)-vkey(a):vkey(a)-vkey(b));
  let body;
  if(volGroup){const games=[...new Set(sorted.map(r=>r.g))];
    body=games.map(g=>`<tr class="gh"><td colspan="7">${logo(g.away)} ${logo(g.home)} ${g.away} at ${g.home} · ${g.kickoff_et} · grade ${f(g.overall,0)} ${g.tier}${g.started?' · kicked off':''}</td></tr>`+
      sorted.filter(r=>r.g===g).map(volRow).join('')).join('')}
  else body=sorted.map(volRow).join('');
  const th=(k,label)=>`<th class="${volSort===k?'on':''}" aria-sort="${volSort===k?(volDir<0?'descending':'ascending'):'none'}"><button data-k="${k}">${label}${volSort===k?(volDir<0?' ▼':' ▲'):''}</button></th>`;
  const leads=rows.filter(r=>r.v.strong.length).length;
  el.innerHTML=`<h3 class="sech">Expected team volume <span>Week ${curWeek} · ${rows.length} offenses · ${leads} strong lean${leads===1?'':'s'} · workload model ${VW.modified} · lines live</span></h3>
    <div class="vwrap"><table class="vt"><thead><tr><th class="l">Team</th><th class="l c-op">Opponent</th>${th('line','Line')}${th('dropbacks','Dropbacks: usual → expected')}${th('rb_opp','RB opportunities: usual → expected')}${th('wrte_tgt','WR/TE targets')}${th('ed_npr','Early-down pass rate')}</tr></thead><tbody>${body}</tbody></table></div>${volHow()}`;
  el.querySelectorAll('th button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(volSort===k)volDir=-volDir;else{volSort=k;volDir=-1}
    if(k==='rb_opp')posView='rb';else if(k==='dropbacks'||k==='wrte_tgt'||k==='ed_npr')posView='pc';
    renderViewSeg();render();saveState()});
  el.querySelectorAll('tbody tr[data-id]').forEach(tr=>tr.onclick=()=>{view='board';applyView();jump(tr.dataset.id)})}
function volHow(){const c=V.coef||{},d=c.dropbacks||{},r=c.rb_opp||{};
  return `<p class="vhow"><b>How team volume works:</b> every offense starts from its usual per-game volume. Two things move it this week: what the opponent's defense forces on offenses (${f(d.def,2)} × that tendency for dropbacks, ${f(r.def,2)} for RB opportunities) and how much more favored the team is than usual (${sgn(d.line,2)} dropbacks and ${sgn(r.line,2)} RB opportunities per point). The line piece uses this board's live consensus spread, so it moves when lines move; hover a change to see Thursday's number. The line barely moves dropbacks but does move RB carries. Backtested on 2021–25. Game flow explains only a small share of weekly volume (dropbacks swing about ±${f(d.sd,0)} from game to game anyway), so +2 to +3 dropbacks is a real lean, not a lock. Strong leans are dropbacks moving 2.5+ or RB opportunities 2+. Pace stays out, like the rest of the board. Click a team to open its game.</p>`}
function volCard(g){const v=g.vol;if(!v)return'';
  const row=t=>{const x=v[t];if(!x)return'';const c=k=>x[k]?`${f(x[k].norm)} → <b>${f(x[k].proj)}</b>${chgSpan(k,x[k],x.strong.includes(k))}`:'–';
    return `<tr><td>${team(t)}</td><td>${c('dropbacks')}</td><td>${c('rb_opp')}</td><td>${x.wrte_tgt?chgSpan('wrte_tgt',x.wrte_tgt,false):'–'}</td></tr>`};
  return `<div class="ledger"><h4>Expected volume</h4><table><tr><th>Team</th><th>Dropbacks</th><th>RB opps</th><th>WR/TE tgts</th></tr>${row(g.away)}${row(g.home)}</table>
    <div class="note">Usual → expected this week from the workload model, with today's line. The Team volume tab has the full slate.</div></div>`}
function applyView(){document.body.classList.toggle('v-vol',view==='vol');
  document.querySelectorAll('#viewTabs button').forEach(b=>{b.classList.toggle('on',b.dataset.view===view);b.setAttribute('aria-pressed',b.dataset.view===view)});
  $('#groupBtn').classList.toggle('on',volGroup);renderViewSeg();renderVolume();saveState()}
$('#viewTabs').onclick=e=>{const v=e.target.closest('button');if(!v)return;view=v.dataset.view;applyView()};
$('#groupBtn').onclick=()=>{volGroup=!volGroup;applyView()};
function renderViewSeg(){document.querySelectorAll('#viewSeg button').forEach(x=>{x.classList.toggle('on',x.dataset.v===posView);
  x.disabled=x.dataset.v!=='overall'&&!P.available&&view!=='vol';x.style.opacity=x.disabled?.4:1})}
$('#viewSeg').onclick=e=>{const v=e.target.dataset.v;if(!v||e.target.disabled)return;posView=v;volSort=v==='rb'?'rb_opp':'dropbacks';volDir=-1;renderViewSeg();render();saveState()};
renderViewSeg();
$('#gaxis').innerHTML=axis(false);
renderAll();
if(!m.volume){$('#viewTabs').hidden=true;view='board'}  // public copy before the tab is approved
document.body.classList.toggle('v-vol',view==='vol');applyView();

// Crystal motes: slow points of light in the sky. About half gather into an ice-point football in the header,
// hold, then drift apart (20s cycle). Behind content only; the opaque sheet hides them over the data.
(function(){const c=$('#motes'),x=c.getContext('2d'),head=$('#head');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,rnd=(a,b)=>a+Math.random()*(b-a);
  const GL=['#ff9aa5','#c6e08a','#aac0ff'];let W=0,H=0;
  function fit(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
  fit();addEventListener('resize',fit);
  const AMB=150,FORM=0,P=[];
  for(let i=0;i<AMB+FORM;i++){const form=i>=AMB;P.push({form,k:(i-AMB)/FORM,x:rnd(0,1),y:rnd(0,1),s:rnd(.8,1.8),vx:rnd(-4,4),vy:rnd(-2.5,3),ph:rnd(0,6.28),tw:rnd(.3,1),far:!form&&Math.random()<.45,col:GL[i%3],j:[rnd(-.004,.004),rnd(-.006,.006)]})}
  function target(k,r){const narrow=r.width<700,cx=narrow?.82:.8,cy=narrow?.11:.2,a=narrow?.1:.13,bb=a*(r.width/r.height)*.42;
    if(k<.7){const th=k/.7*Math.PI*2,sn=Math.sin(th);return [cx+Math.cos(th)*a,cy+bb*Math.sign(sn)*sn*sn]}
    if(k<.82){const u=(k-.7)/.12;return [cx-a*.55+u*a*1.1,cy]}
    const j=Math.floor((k-.82)/.18*6),u=((k-.82)/.18*6)%1;return [cx-a*.42+j*a*.17,cy-bb*.25+u*bb*.5]}
  const CYC=20;let last=performance.now(),raf=0;
  function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000,ph=((t+9)%CYC)/CYC;
    const pull=reduce?1:ph<.08?0:ph<.25?(ph-.08)/.17:ph<.85?1:ph<.97?1-(ph-.85)/.12:0,e=pull*pull*(3-2*pull);
    const r=head.getBoundingClientRect();x.clearRect(0,0,W,H);
    for(const p of P){const bw=p.form?r.width:W,bh=p.form?r.height:H;
      if(!reduce){p.x+=(p.vx+Math.sin(t*.3+p.ph)*3)*dt/bw;p.y+=(p.vy+Math.cos(t*.25+p.ph)*2)*dt/bh}
      if(p.y<-.03){p.y=1.03;p.x=rnd(0,1)}if(p.y>1.03){p.y=-.03;p.x=rnd(0,1)}if(p.x<-.03)p.x=1.03;if(p.x>1.03)p.x=-.03;
      let px=p.x,py=p.y;
      if(p.form){const [tx,ty]=target(p.k,r);px=p.x+(tx+p.j[0]-p.x)*e;py=p.y+(ty+p.j[1]-p.y)*e;if(e>.99&&!reduce){p.x=px;p.y=py}
        px=r.left+px*r.width;py=r.top+py*r.height;if(py<-10||py>H+10)continue}
      else{px*=W;py*=H}
      const tw=reduce?.6:Math.max(0,Math.sin(t*p.tw+p.ph)),g=Math.pow(tw,10);
      const fe=p.form?e:0;x.globalAlpha=Math.min(1,(p.far?.55:.92)*(.55+.45*tw)+.3*fe);x.fillStyle='#fbfdfe';x.beginPath();x.arc(px,py,p.s*(p.far?.7:1)*(1+.3*fe),0,7);x.fill();
      if(g>.06&&!p.far){const rr=p.s*(.9+g);x.globalAlpha=g;x.strokeStyle=g>.5?p.col:'#fff';x.lineWidth=1;x.beginPath();x.moveTo(px-rr*2.6,py);x.lineTo(px+rr*2.6,py);x.moveTo(px,py-rr*2.6);x.lineTo(px,py+rr*2.6);x.stroke()}}
    x.globalAlpha=1;if(!reduce&&!document.hidden)raf=requestAnimationFrame(frame)}
  if(reduce){frame(performance.now());addEventListener('resize',()=>frame(performance.now()));addEventListener('scroll',()=>frame(performance.now()),{passive:true})}
  else{raf=requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{if(!document.hidden){cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(frame)}})}
})();
</script></body></html>
