<!doctype html>
<html lang="en"><head>
<meta name="robots" content="noindex"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Environment Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--panel:#0e121c;--panel2:#141a27;--line:#212a3c;--text:#e8ecf5;--muted:#8a94ab;
--neon:#39ff9f;--cyan:#2fd4ff;--pink:#ff3fa4;--amber:#ffc24b;--red:#ff5864;
--elite:#39ff9f;--strong:#2fd4ff;--neutral:#a3adc2;--weak:#ffc24b;--avoid:#ff5864}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:28px 16px 60px}
h1{font:800 40px/1 'Barlow Condensed',sans-serif;letter-spacing:.5px;margin:0;text-transform:uppercase}
h1 span{color:var(--neon);text-shadow:0 0 18px rgba(57,255,159,.45)}
.sub{color:var(--muted);margin:8px 0 22px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
.chip b{color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:500}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);padding:8px 12px;font:600 12px Inter;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--neon)}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:600 12px Inter}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px}
.tbl th{font:700 11px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 10px}
.tbl td{background:var(--panel);padding:12px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}
.tbl td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
tr.game{cursor:pointer}
.tbl th:first-child{width:27%}
.tbl td .mono,.tbl td .small{white-space:nowrap}
.tbl td:first-child .small{white-space:normal}
tr.game:hover td{background:var(--panel2)}
.mono{font-family:'JetBrains Mono',monospace}
.match{font:700 20px 'Barlow Condensed';letter-spacing:.3px}
.small{font-size:11.5px;color:var(--muted)}
.score{display:flex;align-items:center;gap:10px;min-width:150px}
.ring{--p:50;--c:var(--neon);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
background:conic-gradient(var(--c) calc(var(--p)*1%),#1c2333 0);position:relative;flex:none}
.ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.ring span{position:relative;z-index:1;font:700 16px 'Barlow Condensed'}
tr.game:hover .ring::after{background:var(--panel2)}
.tier{font:700 12px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase}
.big{font:700 20px 'Barlow Condensed'}
.books{display:flex;gap:6px;margin-top:2px}
.books span{font:500 10.5px 'JetBrains Mono';color:var(--muted)}
.team{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.logo{width:28px;height:28px;object-fit:contain;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.logo.sm{width:18px;height:18px}
.match{display:flex;align-items:center;gap:8px}
.match .at{color:var(--muted);font-size:14px}
.wx{display:flex;gap:8px;align-items:center}
.wx .ic{font-size:20px}
.detail td{background:var(--panel2)!important;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h4{margin:0 0 10px;font:700 13px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:var(--cyan)}
.card table{width:100%;border-collapse:collapse;font-size:12px}
.card th,.card td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line);background:none!important;border-left:0!important;border-right:0!important;border-radius:0!important}
.card th:first-child,.card td:first-child{text-align:left}
.card th{color:var(--muted);font-weight:600}
.rk{color:var(--muted);font-size:10.5px}
.watch{font-size:11.5px;color:var(--neon);margin-top:3px}
.watch .nb{display:inline-block;background:rgba(57,255,159,.12);border:1px solid rgba(57,255,159,.4);border-radius:6px;padding:0 6px;margin-right:6px;font-weight:600}
.notes{grid-column:1/-1;border-color:rgba(57,255,159,.35)}
.notes h4{color:var(--neon)}
.notes .calls{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 14px}
.call{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--cc);border-radius:7px;padding:2px 8px 2px 3px;white-space:nowrap;background:color-mix(in srgb,var(--cc) 8%,transparent)}
.call b{font:700 10px 'Barlow Condensed';letter-spacing:.8px;text-transform:uppercase;background:var(--cc);color:#07090f;border-radius:5px;padding:1px 5px}
.call .ps{color:var(--muted);font-size:10.5px}
.rowcalls{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rowcalls .call{font-size:11px;padding:1px 7px 1px 2px}
.c-smash{--cc:#39ff9f}.c-start{--cc:#2fd4ff}.c-desp{--cc:#ffc24b}.c-stream{--cc:#b58cff}.c-watch{--cc:#8a94ab}.c-sit{--cc:#ff5864}
.ss{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.ss h4{margin:0 0 10px;font:700 13px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:var(--cyan);display:flex;justify-content:space-between;cursor:pointer}
.ss h4 span{color:var(--muted);font:500 11px Inter;letter-spacing:0;text-transform:none}
.ss.closed .sscols{display:none}
.sscols{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}
.sscol h5{margin:0 0 6px;font:700 11px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:var(--cc)}
.sscol .p{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:8px;cursor:pointer;font-size:12.5px}
.sscol .p:hover{background:var(--panel2)}
.sscol .p .m{margin-left:auto;color:var(--muted);font:500 10.5px 'JetBrains Mono';white-space:nowrap}
.ngrid{columns:3 300px;column-gap:22px}
.ngroup{break-inside:avoid;margin:0 0 12px;padding-left:10px;border-left:2px solid var(--line)}
.ngroup p{margin:0 0 3px;font-size:12.5px;line-height:1.45}
.ngroup p.l0:first-child{font-weight:600}
.ngroup p.l1{padding-left:16px;position:relative;color:#c9d1e3}
.ngroup p.l2{padding-left:32px;position:relative;color:#c9d1e3}
.ngroup p.l1::before,.ngroup p.l2::before{content:"↳";position:absolute;color:var(--neon);opacity:.8}
.ngroup p.l1::before{left:2px}.ngroup p.l2::before{left:18px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font:600 12px Inter;cursor:pointer}
.btn.on{color:var(--neon);border-color:rgba(57,255,159,.5)}
.btn:hover{color:var(--text)}
.chg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.chg h4{margin:0 0 8px;font:700 13px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:var(--amber);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.chg h4 span{color:var(--muted);font:500 11px Inter;letter-spacing:0;text-transform:none}
.chg ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:5px 22px}
.chg li{font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.chg li .t{color:var(--muted);font:500 11px 'JetBrains Mono';min-width:78px}
.chg li .g{font-weight:600;min-width:74px}
.chg.closed ul{display:none}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.bdg{font:600 10.5px Inter;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.bdg.up{color:var(--neon);border-color:rgba(57,255,159,.45)}
.bdg.down{color:var(--red);border-color:rgba(255,88,100,.45)}
.bdg.info{color:var(--amber);border-color:rgba(255,194,75,.45)}
tr.game.started td{opacity:.62}
.ko{display:inline-block;font:700 10px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px}
.card tr.cons td{color:var(--neon);font-weight:600}
.note{font-size:11.5px;color:var(--muted);margin-top:8px}
.foot{margin-top:28px;color:var(--muted);font-size:12px;line-height:1.6}
.demo{background:rgba(255,63,164,.12);border:1px solid var(--pink);color:#ffc1e0;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
@media(max-width:900px) and (min-width:721px){.hide-m{display:none}.tbl td{padding:10px 8px}}
.disclaimer{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
@media(max-width:720px){
  .wrap{padding:18px 12px 40px}
  h1{font-size:30px}
  .tbl,.tbl>tbody{display:block;width:100%}
  .tbl thead{display:none}
  .tbl tr.game{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .tbl tr.game td{display:block;background:none!important;border:0!important;padding:0;border-radius:0!important;min-width:0}
  .tbl tr.game td:first-child{grid-column:1/-1}
  .tbl tr.game td:last-child{grid-column:1/-1}
  .tbl th:first-child{width:auto}
  .tbl tr.detail{display:block;margin:-6px 0 12px}
  .tbl tr.detail>td{display:block;border-radius:0 0 14px 14px;padding:12px}
  .grid{grid-template-columns:1fr}
  .ngrid{columns:1}
  .chg ul{grid-template-columns:1fr}
  .chg li{flex-wrap:wrap;gap:2px 8px}
  .sscols{grid-template-columns:1fr 1fr}
  .score{min-width:0}
  .seg{overflow-x:auto;max-width:100%}
  .chips{gap:6px}
  .card table{font-size:11.5px}
  .tbl td .small,.tbl td .mono{white-space:normal}
  .books{flex-wrap:wrap;gap:2px 6px}
  .score .small{font-size:10.5px}
}
</style></head><body><div class="wrap">

</div>

const fmtT=iso=>{const d=new Date(iso);return d.toLocaleDateString('en-US',{weekday:'short'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(' ','').toLowerCase()};
function groupChanges(list){const by=new Map();
  list.forEach(c=>{const k=c.time+'|'+c.game;if(!by.has(k))by.set(k,{time:c.time,game:c.game,items:[]});by.get(k).items.push(c)});
  return [...by.values()].map(r=>{const parts=[],calls={};
    r.items.forEach(c=>{const m=c.kind==='calls'&&c.text.match(/^(.+?): (.+) \(new call\)$/);
      if(m)(calls[m[1]]=calls[m[1]]||[]).push(m[2]);else parts.push(c.kind==='notes'?c.text.toLowerCase():c.text)});
    const callTxt=Object.entries(calls).map(([k,v])=>k+' '+v.join(', '));
    return {time:r.time,game:r.game,text:[...parts.filter(p=>!/^notes/.test(p)),...callTxt,...parts.filter(p=>/^notes/.test(p))].join(' · ')}})}
function renderChanges(){const recent=CH.filter(c=>new Date(c.time)>ago(48));

  $('#chgHead').onclick=()=>{chgClosed=!chgClosed;saveState();renderChanges()}}

function badges(g){const k=g.away+'@'+g.home, seen=new Set();
  return CH.filter(c=>c.game===k&&new Date(c.time)>ago(24)&&!seen.has(c.kind)&&seen.add(c.kind)).map(c=>{
    const t={total:`Total ${c.up?'▲':'▼'}`,spread:'Spread moved',weather:`Weather ${c.up?'▲':'▼'}`,notes:c.text,calls:'Calls updated',tier:c.text.replace('Tier ','')}[c.kind]||c.text;
    const cls=['notes','spread','calls'].includes(c.kind)?'info':(c.up?'up':'down');
    return `<span class="bdg ${cls}" title="${esc(fmtT(c.time)+': '+c.text)}">${esc(t)}</span>`}).join('')}

    ${g.notes?`<div class="rowcalls">${g.notes.groups.length?'<span class="call c-watch" title="Has game notes"><b>📝</b>Notes</span>':''}${g.notes.calls.map(c=>callChip(c,false)).join('')}</div>`:''}${bd?`<div class="badges">${bd}</div>`:''}</td>
  <td><div class="score"><div class="ring" style="--p:${g.overall};--c:${c}"><span>${f(g.overall,0)}</span></div>
    <div><div class="tier" style="color:${c}">${g.tier}</div><div class="small mono">V ${f(g.vegas_score,0)} · P ${f(g.pace_score,0)} · W ${f(g.weather.score,0)}</div></div></div></td>
  <td><div class="big mono">${f(g.total)}</div><div class="books">${bk}</div><div class="small">${fav} −${f(Math.abs(g.margin||0))}</div></td>
  <td class="hide-m"><div class="mono">${team(g.away)} ${f(g.team_totals[g.away])}</div><div class="mono">${team(g.home)} ${f(g.team_totals[g.home])}</div>
    <div class="small">${g.tt_source[g.home]==='market'?'team total market':'implied from spread'}</div></td>
  <td class="hide-m">${g.pace?`<div class="mono">${f(g.pace.ppg)} <span class="small">plays</span></div><div class="mono">${f(g.pace.ppd,2)} <span class="small">per drive</span></div><div class="mono">${f(g.pace.spp)}s <span class="small">per play</span></div>`:'–'}</td>
  <td><div class="wx"><span class="ic">${wxIcon(g)}</span><div><div class="mono">${f(g.weather.score,0)}</div><div class="small">${g.weather.label}</div></div></div></td></tr>`;
}
const CALL_ORDER=['Smash Spot','Must Start','Start','Sneaky Start','Desperate Start','Stream','Sleeper','Flex','Watch','Sit','Fade'];
const callCls=c=>({'Smash Spot':'c-smash','Must Start':'c-smash','Start':'c-start','Sneaky Start':'c-start','Flex':'c-start',
  'Desperate Start':'c-desp','Stream':'c-stream','Sleeper':'c-stream','Watch':'c-watch','Sit':'c-sit','Fade':'c-sit'})[c]||'c-watch';
function callChip(c,full){return `<span class="call ${callCls(c.call)}"><b>${esc(c.call)}</b>${full&&c.team?logo(c.team,'sm'):''}${esc(c.name)}${full&&c.pos?` <span class="ps">${c.pos}</span>`:''}</span>`}
let ssClosed=false;try{ssClosed=!!(JSON.parse(localStorage.getItem(SKEY)||'{}').ssClosed)}catch(e){}
function renderStartSit(){const rows=[];
  D.games.forEach(g=>(g.notes&&g.notes.calls||[]).forEach(c=>rows.push({c,g})));
  if(!rows.length){$('#startsit').innerHTML='';return}
  const cols=CALL_ORDER.filter(k=>rows.some(r=>r.c.call===k)).map(k=>{
    const list=rows.filter(r=>r.c.call===k).sort((a,b)=>b.g.overall-a.g.overall);
    return `<div class="sscol ${callCls(k)}"><h5>${k} · ${list.length}</h5>${list.map(({c,g})=>{
      const opp=c.team?(c.team===g.home?'vs '+g.away:'@ '+g.home):g.away+' @ '+g.home;
      return `<div class="p" data-id="${g.id}">${c.team?logo(c.team,'sm'):''}<span>${esc(c.name)}${c.pos?` <span class="ps small">${c.pos}</span>`:''}</span><span class="m">${opp} · ${f(g.overall,0)}</span></div>`}).join('')}</div>`}).join('');
  $('#startsit').innerHTML=`<div class="ss ${ssClosed?'closed':''}"><h4 id="ssHead">Start / Sit <span>${rows.length} calls · env score shown · ${ssClosed?'show':'hide'}</span></h4><div class="sscols">${cols}</div></div>`;
  $('#ssHead').onclick=()=>{ssClosed=!ssClosed;try{const st=JSON.parse(localStorage.getItem(SKEY)||'{}');st.ssClosed=ssClosed;localStorage.setItem(SKEY,JSON.stringify(st))}catch(e){}renderStartSit()};
  document.querySelectorAll('.sscol .p').forEach(el=>el.onclick=()=>{open.add(el.dataset.id);render();saveState();
    const tr=document.querySelector(`tr.game[data-id="${el.dataset.id}"]`);if(tr)tr.scrollIntoView({behavior:'smooth',block:'start'})});
}
function notesCard(g){const n=g.notes;if(!n)return'';
  const groups=n.groups.map(gr=>`<div class="ngroup">${gr.map(l=>`<p class="l${l.level}">${esc(l.text)}</p>`).join('')}</div>`).join('');
  return `<div class="card notes"><h4>Game notes</h4>${n.calls.length?`<div class="calls">${n.calls.map(c=>callChip(c,true)).join('')}</div>`:''}<div class="ngrid">${groups}</div></div>`}
function detail(g){
  const h=g.home,a=g.away;
  const bookRows=D.bookKeys.map((k,i)=>{const x=g.books[k];if(!x)return`<tr><td>${D.books[i]}</td><td colspan="4">not posted</td></tr>`;
    return `<tr><td>${D.books[i]}</td><td>${f(x.total)}</td><td>${x.spread_home==null?'–':(x.spread_home>0?'+':'')+f(x.spread_home)}</td><td>${f(x.tt[a])}</td><td>${f(x.tt[h])}</td></tr>`}).join('');
  const lines=`<div class="card"><h4>Lines by book</h4><table><tr><th>Book</th><th>Total</th><th>${h} spread</th><th>${a} TT</th><th>${h} TT</th></tr>${bookRows}
   <tr class="cons"><td>Consensus</td><td>${f(g.total)}</td><td>${g.margin>=0?'−':'+'}${f(Math.abs(g.margin||0))}</td><td>${f(g.team_totals[a])}</td><td>${f(g.team_totals[h])}</td></tr></table>
   <div class="note">Consensus = weighted average of juice-adjusted lines (a 47.5 at −120 counts a bit higher than 47.5).</div></div>`;
  const tp=g.team_pace,wr=g.weather.raw,rf=g.venue.roof;
  const wxCard=`<div class="card"><h4>Weather</h4>${rf!=='open'?`<div class="small">${rf==='dome'?'Indoors: weather doesn\'t matter.':'Retractable roof: normally closed when conditions are bad.'}</div>`:
    !wr?'<div class="small">Forecast not available yet (about 15 days out).</div>':
    `<table><tr><td>Temperature</td><td>${f(wr.temp_f,0)}°F</td></tr><tr><td>Wind (avg)</td><td>${f(wr.wind_mph,0)} mph</td></tr>
     <tr><td>Max gust</td><td>${f(wr.gust_mph,0)} mph</td></tr><tr><td>Precip chance</td><td>${f(wr.precip_prob,0)}%</td></tr>
     <tr><td>Precip total</td><td>${f(wr.precip_in,2)} in</td></tr>${wr.snow?'<tr><td>Snow</td><td>yes</td></tr>':''}</table>
     <div class="note">Averaged over the game window. Wind and rain together get an extra penalty.</div>`}</div>`;
  const pr=t=>{const p=tp[t];if(!p)return`<tr><td>${t}</td><td colspan="3">–</td></tr>`;
    return `<tr><td>${team(t)}</td><td>${f(p.ppg)} <span class="rk">#${p.ppg_rank}</span></td><td>${f(p.ppd,2)} <span class="rk">#${p.ppd_rank}</span></td><td>${f(p.spp)} <span class="rk">#${p.spp_rank}</span></td></tr>`};
  const cur=tp[h]?tp[h].games_cur:0;
  const pace=`<div class="card"><h4>Pace of play</h4><table><tr><th>Team</th><th>Plays/G</th><th>Plays/Dr</th><th>Sec/Play</th></tr>${pr(a)}${pr(h)}</table>
    <div class="note">Sec/play = time between snaps in close-game situations (#1 = fastest). Blends this season (${cur} games) with last season until the sample grows.</div></div>`;
  const w=g.weather,W=D.weights;
  const why=`<div class="card"><h4>Score breakdown</h4><table>
    <tr><td>Vegas (total ${f(g.total)} vs ${f(b.total)} baseline)</td><td>${f(g.vegas_score,0)}</td><td>× ${W.vegas}</td></tr>
    <tr><td>Pace (${g.pace?pct(g.pace.ppg_pct)+' plays, '+pct(g.pace.ppd_pct)+' per drive, '+pct(g.pace.tempo_pct)+' tempo':'n/a'})</td><td>${f(g.pace_score,0)}</td><td>× ${W.pace}</td></tr>
    <tr><td>Weather (${w.label})</td><td>${f(w.score,0)}</td><td>× ${W.weather}</td></tr>
    <tr class="cons"><td>Overall</td><td>${f(g.overall,1)}</td><td></td></tr></table>
</div>`;
  return `<tr class="detail"><td colspan="6"><div class="grid">${notesCard(g)}${why}${lines}${pace}${wxCard}</div></td></tr>`;
}
$('#foot').innerHTML=`Click any game to expand it. Vegas: consensus total vs the ${b.total_source}, with a small penalty for lopsided spreads. Pace uses nflverse play-by-play: plays per game and per drive (offensive snaps without kneels or spikes) plus tempo, the seconds between snaps in close-game situations. Weather: Open-Meteo forecast averaged over the game window.`+
  (m.public?`<div class="disclaimer">From The Pocket · For information and entertainment only, not betting advice. Lines and forecasts change; check your sportsbook before placing anything. Last updated ${m.generated}.</div>`:'');
render();
renderStartSit();
</script></body></html>
