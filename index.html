<!doctype html>
<html lang="en"><head>
<meta name="robots" content="noindex"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Environment Board · From The Pocket</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%2296%22%20fill%3D%22%23111318%22/%3E%3Ctext%20x%3D%22256%22%20y%3D%22228%22%20text-anchor%3D%22middle%22%20font-family%3D%22Inter%2CArial%2CHelvetica%2Csans-serif%22%20font-weight%3D%22700%22%20font-size%3D%22196%22%20fill%3D%22%2300c896%22%3EFTP%3C/text%3E%3Crect%20x%3D%22146%22%20y%3D%22360%22%20width%3D%2236%22%20height%3D%2256%22%20rx%3D%225%22%20fill%3D%22%2300c896%22/%3E%3Crect%20x%3D%22192%22%20y%3D%22332%22%20width%3D%2236%22%20height%3D%2284%22%20rx%3D%225%22%20fill%3D%22%2300c896%22/%3E%3Crect%20x%3D%22238%22%20y%3D%22304%22%20width%3D%2236%22%20height%3D%22112%22%20rx%3D%225%22%20fill%3D%22%2300c896%22/%3E%3Crect%20x%3D%22284%22%20y%3D%22332%22%20width%3D%2236%22%20height%3D%2284%22%20rx%3D%225%22%20fill%3D%22%23f87171%22/%3E%3Crect%20x%3D%22330%22%20y%3D%22360%22%20width%3D%2236%22%20height%3D%2256%22%20rx%3D%225%22%20fill%3D%22%23f87171%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--panel:#0e121c;--panel2:#141a27;--line:#212a3c;--text:#e8ecf5;--muted:#8a94ab;
--neon:#39ff9f;--cyan:#2fd4ff;--pink:#ff3fa4;--amber:#ffc24b;--red:#ff5864;
--elite:#39ff9f;--strong:#2fd4ff;--neutral:#a3adc2;--weak:#ffc24b;--avoid:#ff5864}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:28px 16px 60px}
h1{font:800 40px/1 'Barlow Condensed',sans-serif;letter-spacing:.5px;margin:0;text-transform:uppercase}
h1 span{color:var(--neon);text-shadow:0 0 18px rgba(57,255,159,.45)}
.sub{color:var(--muted);margin:8px 0 22px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
.chip b{color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:500}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);padding:8px 12px;font:600 12px Inter;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--neon)}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:600 12px Inter}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px}
.tbl th{font:700 11px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 10px}
.tbl td{background:var(--panel);padding:12px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}
.tbl td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
tr.game{cursor:pointer}
.tbl tr.game.spot td{border-color:rgba(0,200,150,.55)}
.tbl tr.game.spot td:first-child{box-shadow:inset 3px 0 0 #00c896}
.spotbdg{display:inline-flex;align-items:center;gap:4px;font:700 10.5px Inter;letter-spacing:.6px;text-transform:uppercase;color:#00c896;background:rgba(0,200,150,.12);border:1px solid rgba(0,200,150,.5);border-radius:6px;padding:2px 7px}
.spotbdg svg,.spoth svg{width:14px;height:14px;border-radius:3px}
.spot-wrap{margin-bottom:16px}
.spoth{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:700 13px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:#00c896}
.spoth span{color:var(--muted);font:500 11px Inter;letter-spacing:0;text-transform:none}
.spotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.spc{background:var(--panel);border:1px solid rgba(0,200,150,.55);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:inset 0 3px 0 #00c896}
.spc:hover{background:var(--panel2)}
.spc .mt{font:700 18px 'Barlow Condensed';display:flex;align-items:center;gap:4px}
.spc .row1{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.spc .ring{transform:scale(.85);transform-origin:left center}
.spc .pos{margin-top:0}
.spc .rowcalls{margin-top:8px}
.tbl th:first-child{width:27%}
.tbl td .mono,.tbl td .small{white-space:nowrap}
.tbl td:first-child .small{white-space:normal}
.tbl .wx .small{white-space:normal;max-width:170px}
tr.game:hover td{background:var(--panel2)}
.mono{font-family:'JetBrains Mono',monospace}
.match{font:700 20px 'Barlow Condensed';letter-spacing:.3px}
.small{font-size:11.5px;color:var(--muted)}
.score{display:flex;align-items:center;gap:10px;min-width:150px}
.pos{display:grid;grid-template-columns:auto 38px 38px;gap:3px 6px;margin-top:8px;align-items:center;justify-content:start}
.pos .ph{font:700 9.5px Inter;letter-spacing:.6px;color:var(--muted);text-align:center;text-transform:uppercase}
.pos .pt{display:inline-flex;align-items:center;gap:4px;font:600 11px Inter;color:var(--muted)}
.pb{font:700 11.5px 'JetBrains Mono';border:1px solid var(--tc);color:var(--tc);border-radius:6px;padding:1px 0;text-align:center}
.dim{opacity:.35}
.pm{margin:0 0 12px}.pm:last-of-type{margin-bottom:0}
.pm .pmh{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:5px}
.pm .pml{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;margin:3px 0 0}
.pm .pml b{min-width:96px;color:var(--muted);font-weight:600}
.pm .pmd{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.pm .sc{font:700 12px 'JetBrains Mono';color:var(--tc)}
.dr{font-size:11px;border-radius:5px;padding:1px 6px;background:rgba(255,255,255,.06);color:var(--muted)}
.dr.up{color:var(--elite);background:rgba(0,200,150,.12)}.dr.dn{color:var(--avoid);background:rgba(248,113,113,.12)}
.posnote{background:rgba(255,194,75,.1);border:1px solid rgba(255,194,75,.5);color:#ffe2a8;padding:8px 12px;border-radius:10px;margin-bottom:14px;font-size:12.5px}
.postbl td,.postbl th{text-align:center!important}
.postbl td:first-child,.postbl th:first-child{text-align:left!important}
.ring{--p:50;--c:var(--neon);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
background:conic-gradient(var(--c) calc(var(--p)*1%),#1c2333 0);position:relative;flex:none}
.ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.ring span{position:relative;z-index:1;font:700 16px 'Barlow Condensed'}
tr.game:hover .ring::after{background:var(--panel2)}
.tier{font:700 12px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase}
.big{font:700 20px 'Barlow Condensed'}
.books{display:flex;gap:6px;margin-top:2px}
.books span{font:500 10.5px 'JetBrains Mono';color:var(--muted)}
.team{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.logo{width:28px;height:28px;object-fit:contain;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.logo.sm{width:18px;height:18px}
.match{display:flex;align-items:center;gap:8px}
.match .at{color:var(--muted);font-size:14px}
.wx{display:flex;gap:8px;align-items:center}
.wx .ic{font-size:20px}
.detail td{background:var(--panel2)!important;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h4{margin:0 0 10px;font:700 13px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:var(--cyan)}
.card table{width:100%;border-collapse:collapse;font-size:12px}
.card th,.card td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line);background:none!important;border-left:0!important;border-right:0!important;border-radius:0!important}
.card th:first-child,.card td:first-child{text-align:left}
.card th{color:var(--muted);font-weight:600}
.rk{color:var(--muted);font-size:10.5px}
.watch{font-size:11.5px;color:var(--neon);margin-top:3px}
.watch .nb{display:inline-block;background:rgba(57,255,159,.12);border:1px solid rgba(57,255,159,.4);border-radius:6px;padding:0 6px;margin-right:6px;font-weight:600}
.notes{grid-column:1/-1;border-color:rgba(57,255,159,.35)}
.notes h4{color:var(--neon)}
.notes .calls{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 14px}
.call{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--cc);border-radius:7px;padding:2px 8px 2px 3px;white-space:nowrap;background:color-mix(in srgb,var(--cc) 8%,transparent)}
.call b{font:700 10px 'Barlow Condensed';letter-spacing:.8px;text-transform:uppercase;background:var(--cc);color:#07090f;border-radius:5px;padding:1px 5px}
.call .ps{color:var(--muted);font-size:10.5px}
.rowcalls{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rowcalls .call{font-size:11px;padding:1px 7px 1px 2px}
.c-smash{--cc:#39ff9f}.c-start{--cc:#2fd4ff}.c-desp{--cc:#ffc24b}.c-stream{--cc:#b58cff}.c-watch{--cc:#8a94ab}.c-sit{--cc:#ff5864}
.inj-pill{display:inline-block;font:700 10px 'Barlow Condensed';letter-spacing:.8px;text-transform:uppercase;padding:1px 6px;border-radius:5px;color:#07090f;background:var(--ic);white-space:nowrap}
.i-out{--ic:#ff5864}.i-doubt{--ic:#ff8a4b}.i-q{--ic:#ffc24b}.i-dnp{--ic:#ffd98a}.i-lim{--ic:#8ac8ff}
.rowinj{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.injchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;border:1px solid var(--line);border-radius:7px;padding:1px 7px 1px 2px;white-space:nowrap}
.injchip .ps,.ss .ps{color:var(--muted);font-size:10.5px}
.injtbl td{vertical-align:top;text-align:left!important}
.injtbl td:nth-child(2){width:1%;white-space:nowrap}
.injteam{font:700 12px 'Barlow Condensed';letter-spacing:.8px;margin:8px 0 2px;color:var(--muted)}
.injteam:first-of-type{margin-top:0}
.ss{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.ss h4{margin:0 0 10px;font:700 13px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:var(--cyan);display:flex;justify-content:space-between;cursor:pointer}
.ss h4 span{color:var(--muted);font:500 11px Inter;letter-spacing:0;text-transform:none}
.ss.closed .sscols{display:none}
.sscols{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}
.sscol h5{margin:0 0 6px;font:700 11px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:var(--cc)}
.sscol .p{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:8px;cursor:pointer;font-size:12.5px}
.sscol .p:hover{background:var(--panel2)}
.sscol .p .m{margin-left:auto;color:var(--muted);font:500 10.5px 'JetBrains Mono';white-space:nowrap}
.ngrid{columns:3 300px;column-gap:22px}
.ngroup{break-inside:avoid;margin:0 0 12px;padding-left:10px;border-left:2px solid var(--line)}
.ngroup p{margin:0 0 3px;font-size:12.5px;line-height:1.45}
.ngroup p.l0:first-child{font-weight:600}
.ngroup p.l1{padding-left:16px;position:relative;color:#c9d1e3}
.ngroup p.l2{padding-left:32px;position:relative;color:#c9d1e3}
.ngroup p.l1::before,.ngroup p.l2::before{content:"↳";position:absolute;color:var(--neon);opacity:.8}
.ngroup p.l1::before{left:2px}.ngroup p.l2::before{left:18px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font:600 12px Inter;cursor:pointer}
.btn.on{color:var(--neon);border-color:rgba(57,255,159,.5)}
.btn:hover{color:var(--text)}
.weeks{display:flex;gap:8px;margin:0 0 16px;overflow-x:auto;padding-bottom:2px}
.wk{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 16px;cursor:pointer;text-align:left;color:var(--text);font-family:Inter}
.wk b{display:block;font:800 20px/1.1 'Barlow Condensed';letter-spacing:.5px;text-transform:uppercase}
.wk span{font-size:11px;color:var(--muted)}
.wk.on{border-color:var(--neon);box-shadow:0 0 14px rgba(57,255,159,.18)}
.wk.on b{color:var(--neon)}
.wk .live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--neon);margin-left:6px;vertical-align:middle}
.chg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.chg h4{margin:0 0 8px;font:700 13px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:var(--amber);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.chg h4 span{color:var(--muted);font:500 11px Inter;letter-spacing:0;text-transform:none}
.chg ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:5px 22px}
.chg li{font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.chg li .t{color:var(--muted);font:500 11px 'JetBrains Mono';min-width:78px}
.chg li .g{font-weight:600;min-width:74px}
.chg.closed ul{display:none}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.bdg{font:600 10.5px Inter;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.bdg.up{color:var(--neon);border-color:rgba(57,255,159,.45)}
.bdg.down{color:var(--red);border-color:rgba(255,88,100,.45)}
.bdg.info{color:var(--amber);border-color:rgba(255,194,75,.45)}
tr.game.started td{opacity:.62}
.ko{display:inline-block;font:700 10px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px}
.card tr.cons td{color:var(--neon);font-weight:600}
.note{font-size:11.5px;color:var(--muted);margin-top:8px}
.foot{margin-top:28px;color:var(--muted);font-size:12px;line-height:1.6}
.demo{background:rgba(255,63,164,.12);border:1px solid var(--pink);color:#ffc1e0;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
@media(max-width:900px) and (min-width:721px){.hide-m{display:none}.tbl td{padding:10px 8px}}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px;font:700 12px Inter;letter-spacing:2px;text-transform:uppercase;color:#9ca3af}
.brand .mark svg{width:34px;height:34px;display:block}
.credit{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:12px;color:var(--muted)}
.credit b{color:var(--text)}
.credit .mark svg{width:22px;height:22px;display:block}
.disclaimer{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
@media(max-width:720px){
  .wrap{padding:18px 12px 40px}
  h1{font-size:30px}
  .tbl,.tbl>tbody{display:block;width:100%}
  .tbl thead{display:none}
  .tbl tr.game{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .tbl tr.game td{display:block;background:none!important;border:0!important;padding:0;border-radius:0!important;min-width:0}
  .tbl tr.game td:first-child{grid-column:1/-1}
  .tbl tr.game td:last-child{grid-column:1/-1}
  .tbl tr.game.spot{border-color:rgba(0,200,150,.55);box-shadow:inset 3px 0 0 #00c896}
  .tbl tr.game.spot td:first-child{box-shadow:none}
  .spotgrid{grid-template-columns:1fr}
  .tbl th:first-child{width:auto}
  .tbl tr.detail{display:block;margin:-6px 0 12px}
  .tbl tr.detail>td{display:block;border-radius:0 0 14px 14px;padding:12px}
  .grid{grid-template-columns:1fr}
  .ngrid{columns:1}
  .chg ul{grid-template-columns:1fr}
  .chg li{flex-wrap:wrap;gap:2px 8px}
  .sscols{grid-template-columns:1fr 1fr}
  .score{min-width:0}
  .seg{overflow-x:auto;max-width:100%}
  .chips{gap:6px}
  .card table{font-size:11.5px}
  .tbl td .small,.tbl td .mono{white-space:normal}
  .books{flex-wrap:wrap;gap:2px 6px}
  .score .small{font-size:10.5px}
}
</style></head><body><div class="wrap">
<div class="brand"><span class="mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#111318"/><text x="256" y="228" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-weight="700" font-size="196" fill="#00c896">FTP</text><rect x="146" y="360" width="36" height="56" rx="5" fill="#00c896"/><rect x="192" y="332" width="36" height="84" rx="5" fill="#00c896"/><rect x="238" y="304" width="36" height="112" rx="5" fill="#00c896"/><rect x="284" y="332" width="36" height="84" rx="5" fill="#f87171"/><rect x="330" y="360" width="36" height="56" rx="5" fill="#f87171"/></svg></span><span>From The Pocket</span></div>
<h1>Game <span>Environment</span> Board</h1>
<div class="sub" id="sub"></div>
<div class="weeks" id="weekTabs"></div>
<div id="demo"></div>
<div id="posnote"></div>
<div class="chips" id="chips"></div>
<div id="spotlight"></div>
<div id="changes"></div>
<div id="startsit"></div>
<div id="injpanel"></div>
<div class="controls">
  <div class="seg" id="viewSeg"><button data-v="overall">Overall</button><button data-v="pc">Pass Catchers</button><button data-v="rb">RBs</button></div>
  <div class="seg" id="tierSeg"></div>
  <select id="sort">
    <option value="overall">Sort: Overall score</option>
    <option value="total">Sort: Game total</option>
    <option value="pace">Sort: Pace</option>
    <option value="weather">Sort: Weather</option>
    <option value="kick">Sort: Kickoff</option>
  </select>
  <button class="btn" id="notesOnly" title="Show only this week's FTP Spotlight games">★ Spotlight only</button>
  <button class="btn" id="expandAll">Expand all</button>
</div>
<table class="tbl"><thead><tr>
<th>Game</th><th>Environment</th><th>Total / Spread</th><th class="hide-m">Team totals</th>
<th class="hide-m">Pace</th><th>Weather</th></tr></thead><tbody id="body"></tbody></table>
<div class="foot" id="foot"></div>
<div class="credit"><span class="mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#111318"/><text x="256" y="228" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-weight="700" font-size="196" fill="#00c896">FTP</text><rect x="146" y="360" width="36" height="56" rx="5" fill="#00c896"/><rect x="192" y="332" width="36" height="84" rx="5" fill="#00c896"/><rect x="238" y="304" width="36" height="112" rx="5" fill="#00c896"/><rect x="284" y="332" width="36" height="84" rx="5" fill="#f87171"/><rect x="330" y="360" width="36" height="56" rx="5" fill="#f87171"/></svg></span>Built by <b>From The Pocket</b></div>

}
const P=(D.meta.positions||{});
let posView='overall';try{posView=(JSON.parse(localStorage.getItem(SKEY)||'{}').posView)||'overall'}catch(e){}
if(P.note)$('#posnote').innerHTML=`<div class="posnote">${esc(P.note)}</div>`;
const tierOf=v=>v>=70?'Elite':v>=60?'Strong':v>=48?'Neutral':v>=38?'Weak':'Avoid';
function posBest(g,k){const p=g.pos;if(!p)return -1;return Math.max(...Object.values(p).map(x=>x[k]))}
const ord=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');
const ease=r=>r===1?'Easiest':ord(r)+'-easiest';
const posName={pc:'Pass catchers',rb:'RBs'};
function posBadge(x,k){const v=x[k],t=tierOf(v),dim=posView!=='overall'&&posView!==k;
  return `<span class="pb${dim?' dim':''}" style="--tc:${tierColor[t]}" title="${posName[k]}: ${f(v,0)} (${t}). Matchup: ${x.opp} defense is the ${ease(x[k+'_rank']).toLowerCase()} for ${posName[k].toLowerCase()}.">${f(v,0)}</span>`}
function posGrid(g){if(!g.pos)return'';const dim=k=>posView!=='overall'&&posView!==k?' dim':'';
  return `<div class="pos"><span></span><span class="ph${dim('pc')}">PC</span><span class="ph${dim('rb')}">RB</span>${[g.away,g.home].filter(t=>g.pos[t]).map(t=>`<span class="pt">${logo(t,'sm')}${t}</span>${posBadge(g.pos[t],'pc')}${posBadge(g.pos[t],'rb')}`).join('')}</div>`}
function drv(label,z){const c=z>=0.5?'up':z<=-0.5?'dn':'';return `<span class="dr ${c}">${c==='up'?'▲':c==='dn'?'▼':'–'} ${label}</span>`}
function posCard(g){if(!g.pos)return'';
  const blocks=[g.away,g.home].filter(t=>g.pos[t]).map(t=>{const x=g.pos[t];
    const line=(k,extra)=>`<div class="pml"><b>${posName[k]}</b><span class="sc" style="--tc:${tierColor[tierOf(x[k])]}">${f(x[k],0)} ${tierOf(x[k])}</span></div><div class="pmd">${drv(`${ease(x[k+'_rank'])} matchup`,x['opp_'+k+'_z'])}${extra}</div>`;
    return `<div class="pm"><div class="pmh">${team(t)}<span class="small">vs ${x.opp} defense</span></div>
      ${line('pc',drv('Game total',x.z_total)+drv(x.margin>=0?`Favored ${f(x.margin)}`:`Underdog ${f(-x.margin)}`,x.z_fav)+drv('Weather',x.z_weather))}
      ${line('rb',drv(x.margin>=0?`Favored ${f(x.margin)}`:`Underdog ${f(-x.margin)}`,x.z_fav))}</div>`}).join('');
  return `<div class="card"><h4>Position matchups</h4>${blocks}
    <div class="note">Matchup = how the opponent's defense ranks for that position in Game Flow SOS (through Week ${P.data_week}), out of 32. ▲ helps, ▼ hurts compared with the rest of this week's slate.</div></div>`}
function row(g){
  const fav=g.margin>=0?g.home:g.away, c=tierColor[g.tier];
  const bk=D.bookKeys.map((k,i)=>`<span>${D.books[i]} ${g.books[k]?f(g.books[k].total):'–'}</span>`).join('');
  const bd=badges(g);
  return `<tr class="game${g.started?' started':''}${g.notes?' spot':''}" data-id="${g.id}">
  <td><div class="match"><span class="team">${logo(g.away)}${g.away}</span><span class="at">@</span><span class="team">${logo(g.home)}${g.home}</span>${g.started?'<span class="ko">Kicked off</span>':''}</div><div class="small">${g.kickoff_et} · ${g.venue.name}${g.venue.neutral?' (neutral)':''}</div>
    ${g.notes?`<div class="rowcalls"><span class="spotbdg" title="FTP Spotlight game: deep-dive notes inside">${MARK}FTP Spotlight</span>${g.notes.calls.map(c=>callChip(c,false)).join('')}</div>`:''}${rowInjuries(g)}${bd?`<div class="badges">${bd}</div>`:''}</td>
  <td><div class="score"><div class="ring" style="--p:${g.overall};--c:${c}"><span>${f(g.overall,0)}</span></div>
    <div><div class="tier" style="color:${c}">${g.tier}</div><div class="small mono">V ${f(g.vegas_score,0)} · P ${f(g.pace_score,0)} · W ${f(g.weather.score,0)}</div></div></div>${posGrid(g)}</td>
  <td><div class="big mono">${f(g.total)}</div><div class="books">${bk}</div><div class="small">${fav} −${f(Math.abs(g.margin||0))}</div></td>
  <td class="hide-m"><div class="mono">${team(g.away)} ${f(g.team_totals[g.away])}</div><div class="mono">${team(g.home)} ${f(g.team_totals[g.home])}</div>
    <div class="small">${g.tt_source[g.home]==='market'?'team total market':'implied from spread'}</div></td>
  <td class="hide-m">${g.pace?`<div class="mono">${f(g.pace.ppg)} <span class="small">plays</span></div><div class="mono">${f(g.pace.ppd,2)} <span class="small">per drive</span></div><div class="mono">${f(g.pace.spp)}s <span class="small">per play</span></div>`:'–'}</td>
  <td><div class="wx"><span class="ic">${wxIcon(g)}</span><div><div class="mono">${f(g.weather.score,0)}</div><div class="small">${g.weather.label}</div></div></div></td></tr>`;
}
const CALL_ORDER=['Smash Spot','Must Start','Start','Sneaky Start','Desperate Start','Stream','Sleeper','Flex','Watch','Sit','Fade'];
const callCls=c=>({'Smash Spot':'c-smash','Must Start':'c-smash','Start':'c-start','Sneaky Start':'c-start','Flex':'c-start',
  'Desperate Start':'c-desp','Stream':'c-stream','Sleeper':'c-stream','Watch':'c-watch','Sit':'c-sit','Fade':'c-sit'})[c]||'c-watch';
function callChip(c,full){return `<span class="call ${callCls(c.call)}"><b>${esc(c.call)}</b>${full&&c.team?logo(c.team,'sm'):''}${esc(c.name)}${full&&c.pos?` <span class="ps">${c.pos}</span>`:''}</span>`}
const MARK=document.querySelector('.brand .mark').innerHTML;
function renderSpotlight(){const gs=G().filter(g=>g.notes).sort((a,b)=>a.kickoff<b.kickoff?-1:1);
  if(!gs.length){$('#spotlight').innerHTML='';return}
  $('#spotlight').innerHTML=`<div class="spot-wrap"><div class="spoth">${MARK}FTP Spotlight games <span>${gs.length} deep dive${gs.length===1?'':'s'} this week · click a game for the full breakdown</span></div><div class="spotgrid">${gs.map(g=>{const c=tierColor[g.tier];
    return `<div class="spc" data-id="${g.id}"><div class="mt">${logo(g.away)}${g.away}<span class="at">@</span>${logo(g.home)}${g.home}</div><div class="small">${g.kickoff_et}${g.started?' · Kicked off':''}</div>
      <div class="row1"><div class="score" style="min-width:0"><div class="ring" style="--p:${g.overall};--c:${c}"><span>${f(g.overall,0)}</span></div><div><div class="tier" style="color:${c}">${g.tier}</div><div class="small mono">Total ${f(g.total)}</div></div></div>${posGrid(g)}</div>
      ${g.notes.calls.length?`<div class="rowcalls">${g.notes.calls.map(x=>callChip(x,false)).join('')}</div>`:''}</div>`}).join('')}</div></div>`;
  document.querySelectorAll('.spc').forEach(el=>el.onclick=()=>{open.add(el.dataset.id);render();saveState();
    const tr=document.querySelector(`tr.game[data-id="${el.dataset.id}"]`);if(tr)tr.scrollIntoView({behavior:'smooth',block:'start'})});
}
let ssClosed=false;try{ssClosed=!!(JSON.parse(localStorage.getItem(SKEY)||'{}').ssClosed)}catch(e){}
function renderStartSit(){const rows=[];
  G().forEach(g=>(g.notes&&g.notes.calls||[]).forEach(c=>rows.push({c,g})));
  if(!rows.length){$('#startsit').innerHTML='';return}
  const cols=CALL_ORDER.filter(k=>rows.some(r=>r.c.call===k)).map(k=>{
    const list=rows.filter(r=>r.c.call===k).sort((a,b)=>b.g.overall-a.g.overall);
    return `<div class="sscol ${callCls(k)}"><h5>${k} · ${list.length}</h5>${list.map(({c,g})=>{
      const opp=c.team?(c.team===g.home?'vs '+g.away:'@ '+g.home):g.away+' @ '+g.home;
      return `<div class="p" data-id="${g.id}">${c.team?logo(c.team,'sm'):''}<span>${esc(c.name)}${c.pos?` <span class="ps small">${c.pos}</span>`:''}${(()=>{const i=c.team&&injFor(g,c.team,c.name);return i?' '+injPill(i.status):''})()}</span><span class="m">${opp} · ${f(g.overall,0)}</span></div>`}).join('')}</div>`}).join('');
  $('#startsit').innerHTML=`<div class="ss ${ssClosed?'closed':''}"><h4 id="ssHead">Start / Sit <span>${rows.length} calls · env score shown · ${ssClosed?'show':'hide'}</span></h4><div class="sscols">${cols}</div></div>`;
  $('#ssHead').onclick=()=>{ssClosed=!ssClosed;try{const st=JSON.parse(localStorage.getItem(SKEY)||'{}');st.ssClosed=ssClosed;localStorage.setItem(SKEY,JSON.stringify(st))}catch(e){}renderStartSit()};
  document.querySelectorAll('.sscol .p').forEach(el=>el.onclick=()=>{open.add(el.dataset.id);render();saveState();
    const tr=document.querySelector(`tr.game[data-id="${el.dataset.id}"]`);if(tr)tr.scrollIntoView({behavior:'smooth',block:'start'})});
}
const injCls=s=>({Out:'i-out',IR:'i-out',PUP:'i-out',Doubtful:'i-doubt',Questionable:'i-q',DNP:'i-dnp'})[s]||'i-lim';
const SEVERE=new Set(['Out','IR','PUP','Doubtful','Questionable','DNP']);
const injPill=st=>`<span class="inj-pill ${injCls(st)}" title="${st==='DNP'?'Did not practice':st==='Limited'?'Limited practice':st}">${st}</span>`;
const pn=x=>x.toLowerCase().replace(/\b(jr|sr|ii|iii|iv)\b/g,'').replace(/[^a-z]/g,'');
function injFor(g,teamAbbr,name){return ((g.injuries||{})[teamAbbr]||[]).find(e=>pn(e.name)===pn(name))}
function injList(g,pred){const out=[];[g.away,g.home].forEach(t=>((g.injuries||{})[t]||[]).forEach(e=>{if(pred(e))out.push({...e,team:t})}));return out}
function rowInjuries(g){const list=injList(g,e=>e.group==='skill'&&SEVERE.has(e.status));if(!list.length)return'';
  return `<div class="rowinj">${list.slice(0,4).map(e=>`<span class="injchip">${injPill(e.status)}${esc(e.name)} <span class="ps">${e.pos}</span></span>`).join('')}${list.length>4?`<span class="injchip">+${list.length-4} more</span>`:''}</div>`}
function injCard(g){const list=injList(g,()=>true);if(!list.length)return'';
  const byTeam=[g.away,g.home].map(t=>[t,list.filter(e=>e.team===t)]).filter(([,l])=>l.length);
  return `<div class="card"><h4>Injury report</h4>${byTeam.map(([t,l])=>`<div class="injteam">${team(t)}</div><table class="injtbl">${l.map(e=>`<tr><td>${esc(e.name)} <span class="ps">${e.pos}</span></td><td>${injPill(e.status)}</td><td class="small">${esc(e.injury||'')}</td></tr>`).join('')}</table>`).join('')}
    <div class="note">Official injury report, significant players only: fantasy players by snap share, line and defense starters, and your Start/Sit players. DNP = did not practice.</div></div>`}
let injClosed=false;try{injClosed=!!(JSON.parse(localStorage.getItem(SKEY)||'{}').injClosed)}catch(e){}
function renderInjPanel(){const rows=[];G().forEach(g=>injList(g,e=>e.group==='skill').forEach(e=>rows.push({e,g})));
  if(!rows.length){$('#injpanel').innerHTML='';return}
  const cols=[['Out / IR',e=>['Out','IR','PUP'].includes(e.status),'Out'],['Doubtful / Questionable',e=>['Doubtful','Questionable'].includes(e.status),'Questionable'],
    ['Missed practice',e=>e.status==='DNP','DNP'],['Limited practice',e=>e.status==='Limited','Limited']];
  const html=cols.map(([label,pred,st])=>{const list=rows.filter(r=>pred(r.e));if(!list.length)return'';
    return `<div class="sscol" style="--cc:var(${({Out:'--red',Questionable:'--amber',DNP:'--amber',Limited:'--cyan'})[st]})"><h5>${label} · ${list.length}</h5>${list.map(({e,g})=>{
      const opp=e.team===g.home?'vs '+g.away:'@ '+g.home;
      return `<div class="p" data-id="${g.id}">${logo(e.team,'sm')}<span>${esc(e.name)} <span class="ps">${e.pos}</span></span><span class="m">${opp}</span></div>`}).join('')}</div>`}).join('');
  $('#injpanel').innerHTML=`<div class="ss ${injClosed?'closed':''}"><h4 id="injHead" style="color:var(--red)">Key injuries <span>${rows.length} players · official report · ${injClosed?'show':'hide'}</span></h4><div class="sscols">${html}</div></div>`;
  $('#injHead').onclick=()=>{injClosed=!injClosed;try{const st=JSON.parse(localStorage.getItem(SKEY)||'{}');st.injClosed=injClosed;localStorage.setItem(SKEY,JSON.stringify(st))}catch(e){}renderInjPanel()};
  document.querySelectorAll('#injpanel .p').forEach(el=>el.onclick=()=>{open.add(el.dataset.id);render();saveState();
    const tr=document.querySelector(`tr.game[data-id="${el.dataset.id}"]`);if(tr)tr.scrollIntoView({behavior:'smooth',block:'start'})});
}
function notesCard(g){const n=g.notes;if(!n)return'';
  const groups=n.groups.map(gr=>`<div class="ngroup">${gr.map(l=>`<p class="l${l.level}">${esc(l.text)}</p>`).join('')}</div>`).join('');
  return `<div class="card notes"><h4>Game notes</h4>${n.calls.length?`<div class="calls">${n.calls.map(c=>callChip(c,true)).join('')}</div>`:''}<div class="ngrid">${groups}</div></div>`}
function detail(g){
  const h=g.home,a=g.away;
  const bookRows=D.bookKeys.map((k,i)=>{const x=g.books[k];if(!x)return`<tr><td>${D.books[i]}</td><td colspan="4">not posted</td></tr>`;
    return `<tr><td>${D.books[i]}</td><td>${f(x.total)}</td><td>${x.spread_home==null?'–':(x.spread_home>0?'+':'')+f(x.spread_home)}</td><td>${f(x.tt[a])}</td><td>${f(x.tt[h])}</td></tr>`}).join('');
  const lines=`<div class="card"><h4>Lines by book</h4><table><tr><th>Book</th><th>Total</th><th>${h} spread</th><th>${a} TT</th><th>${h} TT</th></tr>${bookRows}
   <tr class="cons"><td>Consensus</td><td>${f(g.total)}</td><td>${g.margin>=0?'−':'+'}${f(Math.abs(g.margin||0))}</td><td>${f(g.team_totals[a])}</td><td>${f(g.team_totals[h])}</td></tr></table>
   <div class="note">Consensus = weighted average of juice-adjusted lines (a 47.5 at −120 counts a bit higher than 47.5).</div></div>`;
  const tp=g.team_pace,wr=g.weather.raw,rf=g.venue.roof;
  const wxCard=`<div class="card"><h4>Weather</h4>${rf!=='open'?`<div class="small">${rf==='dome'?'Indoors: weather doesn\'t matter.':'Retractable roof: normally closed when conditions are bad.'}</div>`:
    !wr?'<div class="small">Forecast not available yet (about 15 days out).</div>':
    `<table><tr><td>Temperature</td><td>${f(wr.temp_f,0)}°F</td></tr><tr><td>Wind (avg)</td><td>${f(wr.wind_mph,0)} mph</td></tr>
     <tr><td>Max gust</td><td>${f(wr.gust_mph,0)} mph</td></tr><tr><td>Precip chance</td><td>${f(wr.precip_prob,0)}%</td></tr>
     <tr><td>Precip total</td><td>${f(wr.precip_in,2)} in</td></tr>${wr.snow?'<tr><td>Snow</td><td>yes</td></tr>':''}</table>
     <div class="note">Averaged over the game window. Wind and rain together get an extra penalty.</div>`}</div>`;
  const pr=t=>{const p=tp[t];if(!p)return`<tr><td>${t}</td><td colspan="3">–</td></tr>`;
    return `<tr><td>${team(t)}</td><td>${f(p.ppg)} <span class="rk">#${p.ppg_rank}</span></td><td>${f(p.ppd,2)} <span class="rk">#${p.ppd_rank}</span></td><td>${f(p.spp)} <span class="rk">#${p.spp_rank}</span></td></tr>`};
  const cur=tp[h]?tp[h].games_cur:0;
  const pace=`<div class="card"><h4>Pace of play</h4><table><tr><th>Team</th><th>Plays/G</th><th>Plays/Dr</th><th>Sec/Play</th></tr>${pr(a)}${pr(h)}</table>
    <div class="note">Sec/play = time between snaps in close-game situations (#1 = fastest). Blends this season (${cur} games) with last season until the sample grows.</div></div>`;
  const w=g.weather,W=D.weights;
  const why=`<div class="card"><h4>Score breakdown</h4><table>
    <tr><td>Vegas (total ${f(g.total)} vs ${f(b.total)} baseline)</td><td>${f(g.vegas_score,0)}</td><td>× ${W.vegas}</td></tr>
    <tr><td>Pace (${g.pace?pct(g.pace.ppg_pct)+' plays, '+pct(g.pace.ppd_pct)+' per drive, '+pct(g.pace.tempo_pct)+' tempo':'n/a'})</td><td>${f(g.pace_score,0)}</td><td>× ${W.pace}</td></tr>
    <tr><td>Weather (${w.label})</td><td>${f(w.score,0)}</td><td>× ${W.weather}</td></tr>
    <tr class="cons"><td>Overall</td><td>${f(g.overall,1)}</td><td></td></tr></table>
</div>`;
  return `<tr class="detail"><td colspan="6"><div class="grid">${notesCard(g)}${injCard(g)}${posCard(g)}${why}${lines}${pace}${wxCard}</div></td></tr>`;
}
$('#foot').innerHTML=(P.available?`<b>How position scores are scored:</b> each team's offense gets a pass-catcher (PC) and RB score, 0–100, colored with the same tiers as the overall score. Pass catchers = 30% opponent Game Flow SOS (pass-catcher environment) + 24% game total + 23% favored by the spread + 23% weather. RBs = 50% opponent SOS (RB environment) + 50% favored by the spread. Total, spread and weather are compared across the week's slate; pace is left out because it didn't predict fantasy production in the SOS backtest. Expand a game to see each team's matchup rank and what's helping or hurting the score. `:'')+`Click any game to expand it. Vegas: consensus total vs the ${b.total_source}, with a small penalty for lopsided spreads. Pace uses nflverse play-by-play: plays per game and per drive (offensive snaps without kneels or spikes) plus tempo, the seconds between snaps in close-game situations. Weather: Open-Meteo forecast averaged over the game window.`+
  (m.public?`<div class="disclaimer">From The Pocket · For information and entertainment only, not betting advice. Lines and forecasts change; check your sportsbook before placing anything. Last updated ${m.generated}.</div>`:'');
function renderViewSeg(){document.querySelectorAll('#viewSeg button').forEach(b=>{b.classList.toggle('on',b.dataset.v===posView);
  b.disabled=b.dataset.v!=='overall'&&!P.available;b.style.opacity=b.disabled?.4:1})}
if(!P.available)posView='overall';
$('#viewSeg').onclick=e=>{const v=e.target.dataset.v;if(!v||e.target.disabled)return;posView=v;renderViewSeg();render();renderSpotlight();
  try{const st=JSON.parse(localStorage.getItem(SKEY)||'{}');st.posView=posView;localStorage.setItem(SKEY,JSON.stringify(st))}catch(e){}};
renderViewSeg();
renderWeeks();
render();
renderSpotlight();
renderStartSit();
renderInjPanel();
</script></body></html>
